<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <title>D-Drive 仕様書</title>
    <?!= include('html/Styles'); ?>
    <!-- currentUser（Auth.js の authenticateSession 結果）をクライアント JS へ渡す。
         W-8 の調整値編集 SPA が role（editor/admin）によって編集可否を切り替えるのに使う。
         initialScreen/initialParams（2026-09-14 追加）: `?page=manual&p=...`（Unity の
         「マニュアル」ボタン）・`?page=order&id=...`/`?page=group&id=...`（O-13 発注リンク）等、
         初回ロード時に既定画面（DEFAULT_SCREEN_ID）以外を開きたい場合に src/Code.js の
         resolveInitialScreen_ が設定する。無ければ null/{}。
         execUrl（O-13 追加）: トップの exec URL（src/Code.js の specWebExecUrl_、
         ScriptApp.getService().getUrl()）。iframe サンドボックス内では window.location が
         script.googleusercontent.com を指すため使えず、発注リンクのコピー機能はこの値を使う。
         取得できない場合は空文字（html/OrderLinkLogic.html 側が空なら何もしない）。 -->
    <script>
      window.SpecWebCurrentUser = <?!= JSON.stringify(currentUser) ?>;
      window.SpecWebInitialScreen = <?!= JSON.stringify(initialScreen || null) ?>;
      window.SpecWebInitialParams = <?!= JSON.stringify(initialParams || {}) ?>;
      window.SpecWebExecUrl = <?!= JSON.stringify(execUrl || '') ?>;
    </script>
  </head>
  <body>
    <div id="app-shell">
      <header class="app-header">
        <h1>D-Drive 仕様書</h1>
        <nav id="app-nav"></nav>
      </header>
      <main id="app-root">読み込み中...</main>
    </div>
    <!--
      html/App.html が registerScreen / SpecWebClient を定義する。
      後続チケット（W-4/5 アセット、W-6〜8 調整値、W-16 機能ページ 等）が
      自分の画面を追加する html を include するときは、
      必ずこの App.html より後に include すること
      （ブラウザは <script> をドキュメント順に実行するため）。
    -->
    <?!= include('html/App'); ?>
    <!-- O-13: 発注リンクのコピー（純粋な URL 組み立て・クリップボード fallback）。
         Assets/OrderTree の両方が使うため、それらより先に include する。 -->
    <?!= include('html/OrderLinkLogic'); ?>
    <?!= include('html/ClipboardCopy'); ?>
    <!--
      O-1〜O-5: アセット発注 一覧・詳細画面。AssetsLogic（純粋関数）→ Assets（registerScreen）の順。
      include() は入れ子のスクリプトレットを評価しないため、AssetsLogic の include は
      Assets.html の中からではなくここに直接書く（Assets.html 側の注意コメント参照）。
    -->
    <?!= include('html/AssetsLogic'); ?>
    <?!= include('html/Assets'); ?>
    <!-- O-2: Presentation 発注グループ + 発注ツリー画面（OrderTreeLogic → OrderTree の順）。 -->
    <?!= include('html/OrderTreeLogic'); ?>
    <?!= include('html/OrderTree'); ?>
    <!-- O-4: 私が発注/私が受けた（AssetsLogic の myOrderedItems/myContractedItems を使う）。 -->
    <?!= include('html/MyOrders'); ?>
    <!-- O-9/O-10: メンバー管理 + ガント URL の設定。 -->
    <?!= include('html/Members'); ?>
    <!-- W-6〜W-8: 調整値編集画面（純粋関数 = TuningGrid を先に、DOM 登録 = Tuning を後に）。O-8 でこのタブが
         新しいナビゲーションからも変わらず開けることを確認済み。 -->
    <?!= include('html/TuningGrid'); ?>
    <?!= include('html/Tuning'); ?>
    <!-- 2026-09-14: デザイナーマニュアル配信画面（Unity の「マニュアル」ボタンから
         `?page=manual&p=...` で開かれる。src/Manual.js の manualGet を呼ぶ）。 -->
    <?!= include('html/Manual'); ?>
  </body>
</html>
