<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <title>D-Drive 仕様書</title>
    <?!= include_('html/Styles'); ?>
    <!-- currentUser（Auth.js の authenticateSession_ 結果）をクライアント JS へ渡す。
         W-8 の調整値編集 SPA が role（editor/admin）によって編集可否を切り替えるのに使う。
         initialScreen/initialParams（2026-09-14 追加）: `?page=manual&p=...`（Unity の
         「マニュアル」ボタン）・`?page=order&id=...`/`?page=group&id=...`（O-13 発注リンク）等、
         初回ロード時に既定画面（DEFAULT_SCREEN_ID）以外を開きたい場合に src/Code.js の
         resolveInitialScreen_ が設定する。無ければ null/{}。
         execUrl（O-13 追加）: トップの exec URL（src/Code.js の specWebExecUrl_、
         ScriptApp.getService().getUrl()）。iframe サンドボックス内では window.location が
         script.googleusercontent.com を指すため使えず、発注リンクのコピー機能はこの値を使う。
         取得できない場合は空文字（html/OrderLinkLogic.html 側が空なら何もしない）。

         2026-09-17（P1-3）: 4 つとも `JSON.stringify` の直書きから src/Code.js の
         specWebJsonForScript_ 経由に変えた。印字スクリプトレット(<?!= …) は非エスケープ出力で JSON.stringify は
         `<` を素通しするため、値に `</script>` を含められると任意 JS が実行できた。
         **ここに新しい値を足すときも必ず specWebJsonForScript_ を通すこと。**
         注意: この HTML コメントの中でも GAS のテンプレート記法(<? … ?>)は評価される。空の
         スクリプトレットを書くとページ全体が SyntaxError になる(2026-09-20 に実際に起きた)。 -->
    <script>
      window.SpecWebCurrentUser = <?!= specWebJsonForScript_(currentUser) ?>;
      window.SpecWebInitialScreen = <?!= specWebJsonForScript_(initialScreen || null) ?>;
      window.SpecWebInitialParams = <?!= specWebJsonForScript_(initialParams || {}) ?>;
      window.SpecWebExecUrl = <?!= specWebJsonForScript_(execUrl || '') ?>;
    </script>
  </head>
  <body>
    <div id="app-shell">
      <header class="app-header">
        <h1>D-Drive 仕様書</h1>
        <nav id="app-nav"></nav>
      </header>
      <main id="app-root">読み込み中...</main>
    </div>
    <!--

    -->
    <?!= include_('html/App'); ?>
