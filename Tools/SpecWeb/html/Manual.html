<script>
  /**
   * マニュアル画面（2026-09-14 追加）。docs/32_spec_web.md「マニュアル配信」節。
   *
   * 本文は Tools/SpecWeb/tools/build-manual.js が docs/DesignerManual・docs/ProgrammerManual の
   * *.html から事前生成した断片 HTML（style インライン化・画像 data URI 化・リンク書き換え済み）を、
   * サーバー側の `manualGet`（src/Manual.js）から取得して innerHTML に差し込むだけ。DOM を
   * 自前で組み立てない（他の画面と違い、コンテンツは docs/DesignerManual|ProgrammerManual 側が正）。
   *
   * ナビゲーション（html/App.html の説明どおり、`<base target="_top">` があるため素の <a> は
   * トップフレームを動かそうとしてしまう）: build-manual.js が本文中の内部リンクに
   * `data-manual-kind`（"designer"/"programmer"）・`data-manual-page`（ページ間、同一/他マニュアル
   * とも同じ属性）・`data-manual-anchor`（同一/他ページ内アンカー）・`data-manual-exit`
   * （発注ツールへ戻る）を付けている。ここではクリックを 1 箇所でイベント委譲して
   * window.SpecWebNavigate で iframe 内遷移する。
   *
   * 緊急修正（2026-09-14）: href 自体は「JS が動かなかったときの素朴なフォールバック」だが、
   * 以前はここに直接 `?page=manual&p=...` のような相対 URL を入れていたため、クリック時に
   * 既定動作が走ると iframe 自身の URL（*-script.googleusercontent.com/userCodeAppPanel）基準で
   * 解決した絶対 URL にトップフレームが遷移し、白画面になる不具合が実デプロイで起きた。
   * ビルド時点では実際の exec URL が分からないため、生成物の href は "#" のプレースホルダーの
   * ままにしてもらい（tools/build-manual.js 参照）、ここ（実行時、window.SpecWebExecUrl が
   * 既に埋め込まれている）で data 属性から絶対 URL を組み立てて href に設定し直す
   * （applyAbsoluteHrefs_）。これで JS ハンドラが万一効かなくても、トップは正しい exec URL
   * （未取得なら "#" のまま＝画面が動かないだけ）に遷移する。
   *
   * 2026-09-17（プログラマーマニュアル配信対応）: 上部ナビに「デザイナーマニュアル」
   * （従来の「マニュアル」を改名）と「プログラマーマニュアル」の 2 本のリンクを置く
   * （SPA のナビゲーションから両方に行けるようにする要望への対応）。
   */
  (function () {
    'use strict';

    var navHost = document.getElementById('app-nav');
    if (navHost && !navHost.querySelector('a[data-screen="manual"]')) {
      var navLink = document.createElement('a');
      // 緊急修正（2026-09-14）: 相対 href '?page=manual&p=Readme' が白画面の原因だったため、
      // window.SpecWebExecUrl から絶対 URL を組み立てる（未取得なら '#'）。
      navLink.href = window.OrderLinkLogic.buildManualUrl(window.SpecWebExecUrl, 'Readme', null, 'designer') || '#';
      navLink.textContent = 'デザイナーマニュアル';
      navLink.setAttribute('data-screen', 'manual');
      navLink.addEventListener('click', function (ev) {
        if (ev && ev.preventDefault) ev.preventDefault();
        window.SpecWebNavigate('manual', { params: { p: 'Readme', kind: 'designer' } });
      });
      navHost.appendChild(navLink);
    }

    if (navHost && !navHost.querySelector('a[data-screen="manual-programmer"]')) {
      var programmerNavLink = document.createElement('a');
      programmerNavLink.href = window.OrderLinkLogic.buildManualUrl(window.SpecWebExecUrl, 'Readme', null, 'programmer') || '#';
      programmerNavLink.textContent = 'プログラマーマニュアル';
      programmerNavLink.setAttribute('data-screen', 'manual-programmer');
      programmerNavLink.addEventListener('click', function (ev) {
        if (ev && ev.preventDefault) ev.preventDefault();
        window.SpecWebNavigate('manual', { params: { p: 'Readme', kind: 'programmer' } });
      });
      navHost.appendChild(programmerNavLink);
    }

    /**
     * 緊急修正（2026-09-14）: build-manual.js が生成する本文中のリンク（data-manual-page/
     * data-manual-exit）は href="#" のプレースホルダーのままなので、挿入後にここで
     * window.SpecWebExecUrl から絶対 URL を組み立てて href を実際の値に差し替える
     * （JS のクリックハンドラが効かなかった場合の素朴なフォールバックを機能させるため）。
     * execUrl が未取得のときは '#' のまま（画面は動かないだけで、白画面には遷移しない）。
     */
    function forEachAnchor_(node, visit) {
      (node.children || []).forEach(function (child) {
        if (child.tagName && String(child.tagName).toUpperCase() === 'A') visit(child);
        forEachAnchor_(child, visit);
      });
    }

    function applyAbsoluteHrefs_(container) {
      var execUrl = window.SpecWebExecUrl || '';
      forEachAnchor_(container, function (anchor) {
        if (!anchor.getAttribute || !anchor.setAttribute) return;
        var exitScreen = anchor.getAttribute('data-manual-exit');
        if (exitScreen) {
          anchor.setAttribute('href', window.OrderLinkLogic.buildExitUrl(execUrl) || '#');
          return;
        }
        var page = anchor.getAttribute('data-manual-page');
        if (page) {
          var anchorId = anchor.getAttribute('data-manual-anchor') || '';
          // 2026-09-17（プログラマーマニュアル配信対応）: data-manual-kind が無いリンク（古い
          // 生成物・手組みのテスト用ノード）は buildManualUrl 側の既定（"designer"）に委ねる。
          var linkKind = anchor.getAttribute('data-manual-kind') || '';
          anchor.setAttribute('href', window.OrderLinkLogic.buildManualUrl(execUrl, page, anchorId, linkKind) || '#');
        }
      });
    }

    function findAnchorAncestor(node, container) {
      while (node && node !== container) {
        if (node.tagName === 'A') return node;
        node = node.parentNode;
      }
      return null;
    }

    /**
     * 本文中の内部リンクへのクリックを 1 箇所で処理する（イベント委譲）。
     * @param {Element} container
     * @param {string} currentKind data-manual-kind が無いリンク（手組みノード・古い生成物）を
     *   遷移させるときのフォールバック kind（現在表示中のマニュアルの kind）。
     */
    function bindManualLinks(container, currentKind) {
      container.addEventListener('click', function (ev) {
        var anchor = findAnchorAncestor(ev.target, container);
        if (!anchor) return;

        var exitScreen = anchor.getAttribute('data-manual-exit');
        if (exitScreen) {
          if (ev.preventDefault) ev.preventDefault();
          window.SpecWebNavigate(exitScreen);
          return;
        }

        var page = anchor.getAttribute('data-manual-page');
        if (page) {
          if (ev.preventDefault) ev.preventDefault();
          var anchorId = anchor.getAttribute('data-manual-anchor') || '';
          // data-manual-kind が無いリンクは現在表示中の画面と同じ kind とみなす
          // （build-manual.js は生成する内部リンクに必ず data-manual-kind を付けるため、
          // 通常はここに来ない。手組みノード・古い生成物向けのフォールバック）。
          var linkKind = anchor.getAttribute('data-manual-kind') || currentKind || 'designer';
          window.SpecWebNavigate('manual', { params: { p: page, anchor: anchorId, kind: linkKind } });
          return;
        }

        var sameAnchor = anchor.getAttribute('data-manual-anchor');
        if (sameAnchor) {
          if (ev.preventDefault) ev.preventDefault();
          scrollToAnchor(container, sameAnchor);
        }
      });
    }

    function scrollToAnchor(container, anchorId) {
      if (!anchorId || !container.querySelector) return;
      var target = null;
      try {
        target = container.querySelector('#' + anchorId);
      } catch (err) {
        target = null; // anchorId に CSS セレクタとして不正な文字が来ても例外にしない。
      }
      if (target && target.scrollIntoView) target.scrollIntoView();
    }

    // テスト用の内部フック（緊急修正 2026-09-14）。test/dom-stub.js の FakeNode は
    // innerHTML=文字列 を子要素へパースしない（コメント参照）ため、applyAbsoluteHrefs_ の
    // 走査ロジック自体は test/manual-screen.smoke.test.js から el.appendChild で組んだ
    // ノードに対して直接呼んで検証する。本番の挙動には影響しない（読み取りのみ公開）。
    window.SpecWebManualTestHooks_ = { applyAbsoluteHrefs: applyAbsoluteHrefs_ };

    registerScreen('manual', function (root, params) {
      params = params || {};
      var pageName = params.p || 'Readme';
      // 2026-09-17（プログラマーマニュアル配信対応）: kind 未指定は "designer"
      // （src/Manual.js の specWebResolveManualKind_ と同じ既定）。
      var kind = params.kind || 'designer';

      var status = document.createElement('p');
      status.className = 'sw-muted';
      status.textContent = 'マニュアルを読み込み中...';
      root.appendChild(status);

      window.SpecWebClient.callApi('manualGet', { p: pageName, kind: kind }).then(function (result) {
        root.innerHTML = '';
        if (!result || !result.ok) {
          var errorEl = document.createElement('p');
          errorEl.textContent = 'マニュアルを読み込めませんでした: ' + ((result && result.error) || '不明なエラー');
          root.appendChild(errorEl);
          return;
        }

        var wrap = document.createElement('div');
        wrap.innerHTML = result.html;
        root.appendChild(wrap);
        applyAbsoluteHrefs_(wrap);
        bindManualLinks(wrap, result.kind || kind);

        if (params.anchor) {
          scrollToAnchor(wrap, params.anchor);
        }
      });
    });
  })();
</script>
