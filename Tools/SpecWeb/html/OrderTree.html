<style>
  .order-tree-toolbar {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }
  .order-tree-toolbar select {
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--sw-border);
    border-radius: 4px;
  }
  .order-tree-toolbar button {
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--sw-accent);
    background: var(--sw-accent);
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
  }
  .order-tree-group {
    border: 1px solid var(--sw-border);
    border-radius: 4px;
    margin-bottom: 0.75rem;
    padding: 0.6rem 0.8rem;
  }
  .order-tree-group-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: bold;
  }
  .order-tree-group-counts {
    font-weight: normal;
    color: var(--sw-muted);
    font-size: 0.85rem;
  }
  .order-tree-wbs-link {
    font-size: 0.85rem;
    color: var(--sw-accent);
    text-decoration: none;
  }
  ul.order-tree-items {
    list-style: none;
    margin: 0.4rem 0 0;
    padding: 0;
  }
  ul.order-tree-items li {
    padding: 0.2rem 0;
    font-size: 0.9rem;
    border-bottom: 1px dashed var(--sw-border);
  }
  .order-tree-new-group {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }
  .order-tree-new-group input {
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--sw-border);
    border-radius: 4px;
  }
  .order-tree-group.sw-highlight {
    border-color: var(--sw-accent);
    box-shadow: 0 0 0 2px var(--sw-accent);
  }
  /* O-15/O-16: 各発注の「編集」・メモアイコン、発注グループの編集フォーム。 */
  ul.order-tree-items li button {
    margin-left: 0.4rem;
    padding: 0.05rem 0.4rem;
    font-size: 0.78rem;
  }
  .order-tree-group-edit {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    border-top: 1px dashed var(--sw-border);
    margin-top: 0.5rem;
    padding-top: 0.5rem;
  }
  .order-tree-group-edit label {
    display: block;
    font-size: 0.8rem;
    color: var(--sw-muted);
    margin-bottom: 0.15rem;
  }
  .order-tree-group-edit input,
  .order-tree-group-edit textarea {
    width: 100%;
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--sw-border);
    border-radius: 4px;
    box-sizing: border-box;
  }
</style>

<script>
  /**
   * 発注ツリー画面（O-2）。docs/32_spec_web.md §10.3.1 を実装する。
   * 集計ロジックは html/OrderTreeLogic.html（window.OrderTreeLogic、DOM 非依存で単体テスト済み）。
   * WBS 番号からガントを開くリンクは O-10（settings.get の ganttUrl。未設定なら非表示）。
   */
  (function () {
    'use strict';

    var logic = window.AssetsLogic;
    var treeLogic = window.OrderTreeLogic;

    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      attrs = attrs || {};
      Object.keys(attrs).forEach(function (key) {
        if (key === 'class') node.className = attrs[key];
        else if (key === 'text') node.textContent = attrs[key];
        else if (key.indexOf('on') === 0 && typeof attrs[key] === 'function') node.addEventListener(key.slice(2), attrs[key]);
        else node.setAttribute(key, attrs[key]);
      });
      (children || []).forEach(function (child) {
        if (child) node.appendChild(child);
      });
      return node;
    }

    /**
     * O-13: 「リンクをコピー」ボタン + ▼ メニュー。html/Assets.html の同名関数と同じ実装
     * （画面ごとに小さく複製する既存方針。el() 自体も両ファイルで複製されている）。
     *
     * @param {Array<function()>} [menuClosers] 2026-09-15 追加: この画面が今開いている
     *   メニューの closeMenu をまとめて把握するための共有配列（呼び出し側=registerScreen の
     *   render が保持する）。開いたら push、閉じたら取り除く。画面を離れる際、この配列に
     *   残っている closeMenu を呼べば document の click/keydown リスナーを確実に外せる
     *   （renderBody() が再描画で DOM を作り直しても、開いていたメニューの document
     *   リスナーは自動では外れない＝そのままでは別の画面に切り替えた後のクリックにも
     *   反応し続けてしまうため）。
     */
    function buildCopyLinkControl(getUrl, getLabel, menuClosers) {
      var wrap = el('span', { class: 'sw-copylink' });
      var status = el('span', { class: 'sw-copylink-status' });
      var menu = el('div', { class: 'sw-copylink-menu' });
      menu.hidden = true;
      var fallback = null;

      // 緊急修正（2026-09-14）: html/Assets.html の同名関数と同じ対策（既定で閉じ、外側クリック/
      // Esc/項目選択で閉じる。CSS 側の `.sw-copylink-menu[hidden]{display:none}` と対）。
      function handleOutsideClick(ev) {
        var target = ev && ev.target;
        if (target && wrap.contains && wrap.contains(target)) return;
        closeMenu();
      }
      function handleKeydown(ev) {
        if (ev && (ev.key === 'Escape' || ev.keyCode === 27)) closeMenu();
      }
      function openMenu() {
        if (!menu.hidden) return;
        menu.hidden = false;
        document.addEventListener('click', handleOutsideClick);
        document.addEventListener('keydown', handleKeydown);
        if (menuClosers) menuClosers.push(closeMenu);
      }
      function closeMenu() {
        if (menu.hidden) return;
        menu.hidden = true;
        document.removeEventListener('click', handleOutsideClick);
        document.removeEventListener('keydown', handleKeydown);
        if (menuClosers) {
          var idx = menuClosers.indexOf(closeMenu);
          if (idx !== -1) menuClosers.splice(idx, 1);
        }
      }

      function clearFallback() {
        if (fallback) {
          wrap.removeChild(fallback);
          fallback = null;
        }
      }

      function doCopy(mode) {
        closeMenu();
        var url = getUrl();
        if (!url) {
          status.textContent = 'URL を取得できませんでした（execUrl 未取得）';
          return;
        }
        var text = window.OrderLinkLogic.formatLinkText(mode, getLabel ? getLabel() : '', url);
        window.SpecWebClipboard.copyText(text).then(function (ok) {
          clearFallback();
          if (ok) {
            status.textContent = 'コピーしました';
            return;
          }
          status.textContent = 'Ctrl+C でコピーしてください';
          fallback = el('input', { type: 'text', readonly: 'readonly', class: 'sw-copylink-fallback' });
          fallback.value = text;
          wrap.appendChild(fallback);
          if (fallback.select) fallback.select();
        });
      }

      var mainButton = el('button', {
        text: 'リンクをコピー',
        onclick: function (ev) {
          if (ev && ev.stopPropagation) ev.stopPropagation();
          doCopy('url');
        }
      });
      var menuButton = el('button', {
        text: '▼',
        onclick: function (ev) {
          if (ev && ev.stopPropagation) ev.stopPropagation();
          if (menu.hidden) openMenu(); else closeMenu();
        }
      });
      [['url', 'URL のみ'], ['named', '名前付き（表示名 - URL）'], ['markdown', 'Markdown']].forEach(function (pair) {
        menu.appendChild(el('button', {
          text: pair[1],
          onclick: function (ev) {
            if (ev && ev.stopPropagation) ev.stopPropagation();
            doCopy(pair[0]);
          }
        }));
      });

      wrap.appendChild(mainButton);
      wrap.appendChild(menuButton);
      wrap.appendChild(menu);
      wrap.appendChild(status);
      return wrap;
    }

    var navHost = document.getElementById('app-nav');
    if (navHost && !navHost.querySelector('a[href="#/orders"]')) {
      navHost.appendChild(el('a', {
        href: '#/orders',
        text: '発注ツリー',
        onclick: function (ev) {
          if (ev && ev.preventDefault) ev.preventDefault();
          window.SpecWebNavigate('orders');
        }
      }));
    }

    registerScreen('orders', function (root, initialParams) {
      var state = {
        groups: [],
        assets: [],
        currentUser: { role: null },
        ganttUrl: '',
        filters: { assetType: '', contractor: '', orderer: '' },
        // O-13: `?page=group&id=...` で開かれた場合に一度だけスクロール+ハイライトする対象の id。
        pendingOpenGroupId: (initialParams && initialParams.openGroupId) || null,
        // O-16: 各発注の「メモあり」アイコンで展開表示した項目の id 集合。
        expandedMemoIds: {},
        // O-15: 「編集」を押して編集フォームを表示中の発注グループ id（無ければ null）。
        editingGroupId: null
      };

      // 2026-09-15 追加: この画面で今開いている「リンクをコピー」メニューの closeMenu 一覧
      // （buildCopyLinkControl 参照）。画面を離れる際にまとめて閉じ、document の
      // click/keydown リスナーを外す（下の cleanup 参照）。
      var menuClosers = [];

      var toolbar = el('div', { class: 'order-tree-toolbar' });
      var newGroupBar = el('div', { class: 'order-tree-new-group' });
      var body = el('div');
      var statusLine = el('p', { class: 'sw-muted' });

      root.appendChild(statusLine);
      root.appendChild(toolbar);
      root.appendChild(newGroupBar);
      root.appendChild(body);

      function canEdit() {
        return logic.roleAtLeast(state.currentUser.role, 'editor');
      }

      function optionValuesFrom(key) {
        var set = {};
        state.assets.forEach(function (a) {
          if (a[key]) set[a[key]] = true;
        });
        return Object.keys(set).sort();
      }

      function buildSelect(options, current, includeAllLabel) {
        var select = el('select');
        select.appendChild(el('option', { value: '', text: includeAllLabel }));
        options.forEach(function (opt) {
          var optionEl = el('option', { value: opt, text: opt });
          if (opt === current) optionEl.selected = true;
          select.appendChild(optionEl);
        });
        return select;
      }

      function filteredAssets() {
        return logic.filterAssets(state.assets, state.filters);
      }

      function renderToolbar() {
        toolbar.innerHTML = '';
        var typeSelect = buildSelect(logic.ASSET_TYPES, state.filters.assetType, '種類: 全て');
        typeSelect.addEventListener('change', function () { state.filters.assetType = typeSelect.value; renderBody(); });
        toolbar.appendChild(typeSelect);

        var contractorSelect = buildSelect(optionValuesFrom('contractor'), state.filters.contractor, '受注者: 全て');
        contractorSelect.addEventListener('change', function () { state.filters.contractor = contractorSelect.value; renderBody(); });
        toolbar.appendChild(contractorSelect);

        var ordererSelect = buildSelect(optionValuesFrom('orderer'), state.filters.orderer, '発注者: 全て');
        ordererSelect.addEventListener('change', function () { state.filters.orderer = ordererSelect.value; renderBody(); });
        toolbar.appendChild(ordererSelect);
      }

      function renderNewGroupBar() {
        newGroupBar.innerHTML = '';
        if (!canEdit()) return;
        var nameInput = el('input', { type: 'text', placeholder: 'Presentation 発注グループ名（例: スキル: 斬撃）' });
        var button = el('button', {
          text: '+ 発注グループを作成',
          onclick: function () {
            submitCreateGroup(button, nameInput);
          }
        });
        // 緊急修正（2026-09-14）: このバーには <form> は無いため Enter で既定の送信は起きないが、
        // 一部のブラウザ/環境差に備えて明示的にハンドラを付け、runBusy の二重実行防止に乗せる
        // （ボタンの click だけに依存しない）。
        nameInput.addEventListener('keydown', function (ev) {
          if (ev && (ev.key === 'Enter' || ev.keyCode === 13)) {
            if (ev.preventDefault) ev.preventDefault();
            submitCreateGroup(button, nameInput);
          }
        });
        newGroupBar.appendChild(nameInput);
        newGroupBar.appendChild(button);
      }

      /**
       * 緊急修正（2026-09-14）: 「発注ツリーで応答が遅く、連打して『aaa』という空の発注グループが
       * 10件近くできた」への対策。SpecWebUi.runBusy で同一操作（'orderGroups.create'）の
       * 二重実行を弾き、ボタンを「送信中...」にして押し続けられないようにする。
       * 成功後は一覧全体を再取得（reload、4 API 呼び出し）せず、応答に含まれる作成済みの
       * グループをその場で state.groups に差し込むだけにする（体感速度の改善・往復削減）。
       */
      function submitCreateGroup(button, nameInput) {
        var name = nameInput.value.trim();
        if (!name) return;
        window.SpecWebUi
          .runBusy('orderGroups.create', button, function () {
            return window.SpecWebClient.callApi('orderGroups.create', { patch: JSON.stringify({ name: name }) }, { method: 'POST' });
          })
          .then(function (res) {
            if (res.busy) return; // 既に送信中（ボタンは disabled なので通常はここに来ない）
            if (!res.ok) {
              window.SpecWebUi.toastError('作成に失敗しました: ' + (res.error || ''));
              return;
            }
            nameInput.value = '';
            state.groups = state.groups.concat([res.item]);
            renderBody();
            window.SpecWebUi.toastSuccess('発注グループを作成しました: ' + res.item.name);
          });
      }

      /**
       * 緊急修正（2026-09-14）: 発注グループの削除。confirm 付き。expectedRevision は
       * node（buildOrderTree の集計結果）に revision を持たせていないため送らず、
       * サーバー側の既定（現在の revision を使う）に任せる（orderGroups.update の
       * 発注グループ名変更等と違い、削除は取り違えても実害が小さい単純な操作のため）。
       * 成功後は一覧全体を再取得せず、その場で state.groups から取り除くだけにする。
       */
      function deleteGroup(node, button) {
        if (!window.confirm('発注グループ「' + node.name + '」を削除します。配下に発注が残っている場合は削除できません。よろしいですか？')) return;
        window.SpecWebUi
          .runBusy('orderGroups.delete:' + node.id, button, function () {
            return window.SpecWebClient.callApi('orderGroups.delete', { id: node.id }, { method: 'POST' });
          })
          .then(function (res) {
            if (res.busy) return;
            if (!res.ok) {
              window.SpecWebUi.toastError('削除に失敗しました: ' + (res.error || ''));
              return;
            }
            state.groups = state.groups.filter(function (g) { return g.id !== node.id; });
            renderBody();
            window.SpecWebUi.toastSuccess('発注グループを削除しました: ' + node.name);
          });
      }

      function renderGroup(node) {
        var box = el('div', { class: 'order-tree-group' });
        if (node.id) box.setAttribute('data-order-group-id', node.id);
        var header = el('div', { class: 'order-tree-group-header' });
        header.appendChild(el('span', { text: node.name }));
        if (node.id) {
          // O-13: 発注グループには専用の詳細画面が無いため、この一覧上のグループヘッダーを
          // 「詳細」相当としてコピーボタンを付ける（docs/32 §10.8 参照）。「単体」バケット
          // （node.id === null）はグループそのものが存在しないため対象外。
          header.appendChild(buildCopyLinkControl(
            function () { return window.OrderLinkLogic.buildGroupUrl(window.SpecWebExecUrl, node.id); },
            function () { return node.name; },
            menuClosers
          ));
        }
        if (node.id && canEdit()) {
          // O-15: 発注グループにも専用の詳細画面が無いため（O-13 と同じ理由）、このヘッダーに
          // 直接「編集」を付ける。押すと下に編集フォーム（renderGroupEditForm）が開く。
          var editGroupButton = el('button', { class: 'secondary', text: '編集' });
          editGroupButton.addEventListener('click', function () {
            state.editingGroupId = state.editingGroupId === node.id ? null : node.id;
            renderBody();
          });
          header.appendChild(editGroupButton);

          // 緊急修正（2026-09-14）: 「削除機能はありますか？」への回答。既存 API
          // orderGroups.delete（src/OrderGroups.js）は配下の発注（parentId で参照するもの）が
          // 1件でも残っていると 400 で拒否する仕様（配下 0 件なら即削除できる）。付け替え・
          // 「単体」への移動は用意していない（拒否メッセージにその旨が入っている）。
          // 「単体」バケット（node.id === null）はグループが存在しないため対象外。
          var deleteGroupButton = el('button', { class: 'secondary', text: '削除' });
          deleteGroupButton.addEventListener('click', function () { deleteGroup(node, deleteGroupButton); });
          header.appendChild(deleteGroupButton);
        }
        if (node.wbsNo && state.ganttUrl) {
          header.appendChild(el('a', {
            class: 'order-tree-wbs-link',
            href: state.ganttUrl,
            target: '_top',
            rel: 'noopener',
            text: 'WBS ' + node.wbsNo + ' ↗'
          }));
        } else if (node.wbsNo) {
          header.appendChild(el('span', { class: 'sw-muted', text: 'WBS ' + node.wbsNo }));
        }
        header.appendChild(el('span', {
          class: 'order-tree-group-counts',
          text: '（' + node.counts.total + '件中 納品済' + node.counts.delivered + '・インポート済' + node.counts.imported + '）'
        }));
        box.appendChild(header);
        if (node.orderer) box.appendChild(el('div', { class: 'sw-muted', text: '発注: ' + node.orderer + (node.dueDate ? ' 期限: ' + node.dueDate : '') }));

        if (node.id && state.editingGroupId === node.id) {
          var form = renderGroupEditForm(node);
          if (form) box.appendChild(form);
        }

        var list = el('ul', { class: 'order-tree-items' });
        node.items.forEach(function (item) {
          list.appendChild(renderOrderItem(item));
        });
        if (node.items.length === 0) {
          list.appendChild(el('li', { class: 'sw-muted', text: '（発注がありません）' }));
        }
        box.appendChild(list);
        return box;
      }

      /**
       * 緊急修正（2026-09-14 追補）: 「一覧から発注を削除することはできないの？」への対応。
       * 発注ツリーの各発注の行にも削除（アーカイブ）ボタンを付ける（html/Assets.html の
       * deleteItemRow と同じ API・確認・runBusy・トーストだが、対象は state.assets の項目）。
       * 元に戻す操作は一覧画面（Assets.html、「アーカイブ済みを表示」トグル）から行う
       * （この画面は reload() で includeArchived: '0' しか取得しないため）。
       */
      function deleteAssetRow(item, button) {
        if (!window.confirm('この発注をアーカイブ（論理削除）します。よろしいですか？')) return;
        window.SpecWebUi
          .runBusy('assets.delete:' + item.id, button, function () {
            return window.SpecWebClient.callApi('assets.delete', { id: item.id, expectedRevision: item.revision }, { method: 'POST' });
          })
          .then(function (res) {
            if (res.busy) return;
            if (!res.ok) {
              window.SpecWebUi.toastError('削除に失敗しました: ' + (res.error || ''));
              return;
            }
            state.assets = state.assets.filter(function (a) { return a.id !== item.id; });
            renderBody();
            window.SpecWebUi.toastSuccess('削除しました（アーカイブ済み。一覧画面の「アーカイブ済みを表示」で元に戻せます）');
          });
      }

      /**
       * O-15: 一覧・「私が発注／私が受けた」と同様、発注ツリーの各発注にも編集への導線を付ける
       * （viewer には出さない）。O-16: メモが入力済みなら 📝 アイコンで整形表示を展開できる。
       */
      function renderOrderItem(item) {
        var li = el('li');
        li.appendChild(el('span', {
          text: item.assetType + ' : ' + item.identifier + '  受注:' + (item.contractor || '—') + '  [' + item.status + ']'
        }));
        if (logic.hasReferenceMd(item)) {
          var expanded = !!state.expandedMemoIds[item.id];
          li.appendChild(el('button', {
            class: 'secondary',
            text: expanded ? '📝 ▲' : '📝',
            onclick: function () {
              state.expandedMemoIds[item.id] = !expanded;
              renderBody();
            }
          }));
        }
        if (canEdit()) {
          li.appendChild(el('button', {
            class: 'secondary',
            text: '編集',
            onclick: function (ev) {
              // 2026-09-15 二度目の修正: この click はまだ document まで bubble する途中
              // （stopPropagation していなかった）。離れる直前の画面が document に張ったままの
              // リスナー（リンクコピー▼メニューの外側クリック判定等）が同じクリックで
              // 誤発火し得たため、ここで打ち切る。加えて画面遷移自体は setTimeout(…, 0) で
              // 「このクリックの処理が完全に終わった後」に行う（同期的な遷移中に document へ
              // 新しく登録されるリスナーが、同じクリックの残り bubble に反応してしまう経路も
              // 塞ぐ）。
              if (ev && ev.stopPropagation) ev.stopPropagation();
              // App.html が定義する画面遷移（このファイルの smoke テストの sandbox には無いため
              // 存在確認してから呼ぶ。実アプリでは常に存在する）。
              if (typeof window.SpecWebNavigate !== 'function') return;
              setTimeout(function () {
                // 緊急修正（2026-09-14 追補）: 戻り先（この画面）を backTo として渡し、
                // 一覧画面（Assets.html）の詳細パネルに「← 発注ツリーへ戻る」を出せるようにする。
                window.SpecWebNavigate('assets', { params: { openId: item.id, backTo: 'orders' } });
              }, 0);
            }
          }));
          var deleteButton = el('button', { class: 'secondary', text: '削除' });
          deleteButton.addEventListener('click', function () { deleteAssetRow(item, deleteButton); });
          li.appendChild(deleteButton);
        }
        if (state.expandedMemoIds[item.id] && logic.hasReferenceMd(item)) {
          var box = el('div', { class: 'assets-md-preview assets-memo-clip' });
          box.innerHTML = logic.renderMarkdownSafe(item.referenceMd);
          li.appendChild(box);
        }
        return li;
      }

      /**
       * O-15: 発注グループの編集フォーム（orderGroups.update、既存 API）。集計済みの node
       * ではなく state.groups の生データ（revision・presentationIdentifier・referenceMd 等を
       * 持つ）を編集対象にする（OrderTreeLogic.buildOrderTree の node は表示用の集計値だけ）。
       */
      function renderGroupEditForm(node) {
        var group = state.groups.filter(function (g) { return g.id === node.id; })[0];
        if (!group) return null;

        var fields = {
          name: group.name || '',
          presentationIdentifier: group.presentationIdentifier || '',
          wbsNo: group.wbsNo || '',
          orderer: group.orderer || '',
          dueDate: group.dueDate || '',
          referenceMd: group.referenceMd || ''
        };

        var wrap = el('div', { class: 'order-tree-group-edit' });

        function fieldRow(key, label, type) {
          var row = el('div');
          row.appendChild(el('label', { text: label }));
          var input = type === 'textarea' ? el('textarea', { rows: '3' }) : el('input', { type: type || 'text' });
          input.value = fields[key];
          input.addEventListener('input', function () { fields[key] = input.value; });
          row.appendChild(input);
          return row;
        }

        wrap.appendChild(fieldRow('name', '名前'));
        wrap.appendChild(fieldRow('presentationIdentifier', 'Presentation 識別子'));
        wrap.appendChild(fieldRow('wbsNo', 'WBS 番号'));
        wrap.appendChild(fieldRow('orderer', '発注者'));
        wrap.appendChild(fieldRow('dueDate', '目安期限', 'date'));
        wrap.appendChild(fieldRow('referenceMd', '説明（Markdown）', 'textarea'));

        var actions = el('div');
        var saveButton = el('button', { text: '保存' });
        saveButton.addEventListener('click', function () {
          window.SpecWebUi
            .runBusy('orderGroups.update:' + group.id, saveButton, function () {
              return window.SpecWebClient.callApi('orderGroups.update', {
                id: group.id, expectedRevision: group.revision, patch: JSON.stringify(fields)
              }, { method: 'POST' });
            })
            .then(function (res) {
              if (res.busy) return;
              if (!res.ok) {
                if (res.status === 409) {
                  window.SpecWebUi.toastError('他の人が先に更新しました。最新の内容を再読込します。');
                  reload();
                  return;
                }
                window.SpecWebUi.toastError('保存に失敗しました: ' + (res.error || ''));
                return;
              }
              state.groups = state.groups.map(function (g) { return g.id === res.item.id ? res.item : g; });
              state.editingGroupId = null;
              renderBody();
              window.SpecWebUi.toastSuccess('保存しました');
            });
        });
        var cancelButton = el('button', {
          class: 'secondary',
          text: 'キャンセル',
          onclick: function () {
            state.editingGroupId = null;
            renderBody();
          }
        });
        actions.appendChild(saveButton);
        actions.appendChild(cancelButton);
        wrap.appendChild(actions);
        return wrap;
      }

      // O-13: renderBody で作った各グループボックスを id で引けるようにする
      // （real DOM の Element.children は Array ではなく HTMLCollection のため
      // .filter が使えない。querySelector に頼らず自前で持つ）。
      var groupBoxesById_ = {};

      function renderBody() {
        body.innerHTML = '';
        groupBoxesById_ = {};
        var tree = treeLogic.buildOrderTree(state.groups, filteredAssets());
        tree.forEach(function (node) {
          var box = renderGroup(node);
          if (node.id) groupBoxesById_[node.id] = box;
          body.appendChild(box);
        });
      }

      /**
       * O-13: `?page=group&id=...` で開かれた場合、読み込み後に一度だけ対象のグループへ
       * スクロール + 一時的なハイライトを行う。この画面には発注グループ専用の詳細パネルが
       * 無いため、一覧上のグループボックス自体を「詳細」相当として扱う（renderGroup 参照）。
       * 見つからなければ例外にせず案内だけ出す（トップ表示は既に renderBody 済み）。
       */
      function maybeOpenPendingGroup() {
        if (!state.pendingOpenGroupId) return;
        var pendingId = state.pendingOpenGroupId;
        state.pendingOpenGroupId = null;
        var box = groupBoxesById_[pendingId];
        if (!box) {
          statusLine.textContent = '指定された発注グループが見つかりません（' + pendingId + '）。発注ツリーを表示しています。';
          return;
        }
        box.className += ' sw-highlight';
        if (box.scrollIntoView) box.scrollIntoView();
      }

      function reload() {
        statusLine.textContent = '読み込み中...';
        return Promise.all([
          window.SpecWebClient.callApi('orderGroups.list', {}),
          window.SpecWebClient.callApi('assets.list', { includeArchived: '0' }),
          window.SpecWebClient.callApi('settings.get', {}),
          window.SpecWebClient.callApi('whoami', {})
        ]).then(function (results) {
          var groupsRes = results[0], assetsRes = results[1], settingsRes = results[2], whoamiRes = results[3];
          state.groups = groupsRes.ok ? groupsRes.items || [] : [];
          state.assets = assetsRes.ok ? assetsRes.items || [] : [];
          state.ganttUrl = settingsRes.ok ? settingsRes.ganttUrl || '' : '';
          if (whoamiRes.ok) state.currentUser = whoamiRes;
          statusLine.textContent = '';
          renderToolbar();
          renderNewGroupBar();
          renderBody();
          maybeOpenPendingGroup();
        });
      }

      reload();

      // 2026-09-15 追加: この画面を離れる際、App.html の renderScreen が呼ぶ後始末。
      // 開いたままの「リンクをコピー」メニューを閉じ、document の click/keydown リスナーを
      // 確実に外す（外さないと、別の画面に切り替えた後のクリックにまで反応してしまう）。
      // 2026-09-15 追加: この画面を離れる際、App.html の renderScreen が呼ぶ後始末。
      // 開いたままの「リンクをコピー」メニューを閉じ、document の click/keydown リスナーを
      // 確実に外す（外さないと、別の画面に切り替えた後のクリックにまで反応してしまう）。
      return function cleanup() {
        menuClosers.slice().forEach(function (close) { close(); });
      };
    });
  })();
</script>
