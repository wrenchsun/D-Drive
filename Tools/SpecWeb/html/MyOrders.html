<style>
  .my-orders-columns {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .my-orders-column {
    flex: 1;
    min-width: 260px;
  }
  .my-orders-column h3 {
    font-size: 1rem;
  }
  ul.my-orders-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.my-orders-list li {
    padding: 0.35rem 0;
    border-bottom: 1px dashed var(--sw-border);
    font-size: 0.9rem;
  }
  .my-orders-badge {
    display: inline-block;
    padding: 0.05rem 0.35rem;
    border-radius: 3px;
    font-size: 0.78rem;
    margin-right: 0.3rem;
    background: #eaeef2;
  }
  .my-orders-badge.sw-overdue {
    background: #ffe3e3;
    color: #cf222e;
  }
  /* O-15/O-16: 各行の「編集」・メモアイコンのボタン。 */
  ul.my-orders-list li button {
    margin-left: 0.4rem;
    padding: 0.05rem 0.4rem;
    font-size: 0.78rem;
  }
</style>

<script>
  /**
   * 「私が発注」「私が受けた」個人ビュー（O-4）。docs/32_spec_web.md §10.3.3 を実装する。
   * 絞り込みロジックは html/AssetsLogic.html（myOrderedItems/myContractedItems、単体テスト済み）。
   * ログイン中のユーザー（whoami の email）を orderer/contractor と照合するだけで、
   * 一覧（Assets.html）に対する固定フィルタ2種として実装する（新しい集計ロジックは持たない）。
   */
  (function () {
    'use strict';

    var logic = window.AssetsLogic;

    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      attrs = attrs || {};
      Object.keys(attrs).forEach(function (key) {
        if (key === 'class') node.className = attrs[key];
        else if (key === 'text') node.textContent = attrs[key];
        else if (key.indexOf('on') === 0 && typeof attrs[key] === 'function') node.addEventListener(key.slice(2), attrs[key]);
        else node.setAttribute(key, attrs[key]);
      });
      (children || []).forEach(function (child) {
        if (child) node.appendChild(child);
      });
      return node;
    }

    var navHost = document.getElementById('app-nav');
    if (navHost && !navHost.querySelector('a[href="#/my-orders"]')) {
      navHost.appendChild(el('a', {
        href: '#/my-orders',
        text: '私の発注',
        onclick: function (ev) {
          if (ev && ev.preventDefault) ev.preventDefault();
          window.SpecWebNavigate('my-orders');
        }
      }));
    }

    function todayString() {
      return new Date().toISOString().slice(0, 10);
    }

    /**
     * 緊急修正（2026-09-14 追補）: 「一覧から発注を削除することはできないの？」への対応。
     * html/Assets.html の deleteItemRow・html/OrderTree.html の deleteAssetRow と同じ
     * API・確認・runBusy・トーストだが、削除後は ordered/contracted 両方の配列から
     * 取り除いて再描画する（呼び出し側が state.onDeleted で渡す）。
     */
    function deleteAssetRow(item, button, onDeleted) {
      if (!window.confirm('この発注をアーカイブ（論理削除）します。よろしいですか？')) return;
      window.SpecWebUi
        .runBusy('assets.delete:' + item.id, button, function () {
          return window.SpecWebClient.callApi('assets.delete', { id: item.id, expectedRevision: item.revision }, { method: 'POST' });
        })
        .then(function (res) {
          if (res.busy) return;
          if (!res.ok) {
            window.SpecWebUi.toastError('削除に失敗しました: ' + (res.error || ''));
            return;
          }
          onDeleted(item.id);
          window.SpecWebUi.toastSuccess('削除しました（アーカイブ済み。一覧画面の「アーカイブ済みを表示」で元に戻せます）');
        });
    }

    /**
     * O-15/O-16: 各行に「編集」（editor 以上のみ、一覧画面〈assets〉の詳細パネルへ遷移する）・
     * 「メモあり」アイコン（押すと整形表示を展開）を付ける。行本体の組み立て方は
     * renderOrderedList/renderContractedList で共通化する（元の書式文言だけが違う）。
     * @param {object} item
     * @param {string} lineText 行本体の表示文言（呼び出し側が組み立てる）
     * @param {{canEdit: boolean, expandedMemoIds: Object, toggleMemo: function(string):void,
     *   onDeleted: function(string):void}} state
     */
    function renderItemLi(item, lineText, state) {
      var li = el('li');
      if (item._overdue) li.appendChild(el('span', { class: 'my-orders-badge sw-overdue', text: '期限切れ' }));
      else if (item._unfulfilled) li.appendChild(el('span', { class: 'my-orders-badge', text: '未納品' }));
      li.appendChild(el('span', { text: lineText }));

      if (logic.hasReferenceMd(item)) {
        var expanded = !!state.expandedMemoIds[item.id];
        li.appendChild(el('button', {
          class: 'secondary',
          text: expanded ? '📝 ▲' : '📝',
          onclick: function () { state.toggleMemo(item.id); }
        }));
      }
      if (state.canEdit) {
        li.appendChild(el('button', {
          class: 'secondary',
          text: '編集',
          onclick: function () {
            // 実アプリでは html/App.html が常に定義する。この画面単体のスモークテストの
            // sandbox には無いことがあるため存在確認してから呼ぶ。
            if (typeof window.SpecWebNavigate === 'function') {
              // 緊急修正（2026-09-14 追補）: 戻り先（この画面）を backTo として渡し、
              // 一覧画面（Assets.html）の詳細パネルに「← 私の発注へ戻る」を出せるようにする。
              window.SpecWebNavigate('assets', { params: { openId: item.id, backTo: 'my-orders' } });
            }
          }
        }));
        var deleteButton = el('button', { class: 'secondary', text: '削除' });
        deleteButton.addEventListener('click', function () { deleteAssetRow(item, deleteButton, state.onDeleted); });
        li.appendChild(deleteButton);
      }
      if (state.expandedMemoIds[item.id] && logic.hasReferenceMd(item)) {
        var box = el('div', { class: 'assets-md-preview assets-memo-clip' });
        box.innerHTML = logic.renderMarkdownSafe(item.referenceMd);
        li.appendChild(box);
      }
      return li;
    }

    function renderOrderedList(items, state) {
      var list = el('ul', { class: 'my-orders-list' });
      if (items.length === 0) list.appendChild(el('li', { class: 'sw-muted', text: '該当する発注はありません' }));
      items.forEach(function (item) {
        var lineText = item.assetType + ' : ' + item.identifier + '  受注:' + (item.contractor || '—') +
          '  期限:' + (item.dueDate || '—') + '  [' + item.status + ']';
        list.appendChild(renderItemLi(item, lineText, state));
      });
      return list;
    }

    function renderContractedList(items, state) {
      var list = el('ul', { class: 'my-orders-list' });
      if (items.length === 0) list.appendChild(el('li', { class: 'sw-muted', text: '該当する発注はありません' }));
      items.forEach(function (item) {
        var lineText = item.assetType + ' : ' + item.identifier + '  発注:' + (item.orderer || '—') +
          '  期限:' + (item.dueDate || '—') + '  [' + item.status + ']';
        list.appendChild(renderItemLi(item, lineText, state));
      });
      return list;
    }

    registerScreen('my-orders', function (root) {
      var statusLine = el('p', { class: 'sw-muted', text: '読み込み中...' });
      var columns = el('div', { class: 'my-orders-columns' });
      root.appendChild(statusLine);
      root.appendChild(columns);

      // O-16: 「メモあり」アイコンで展開表示した項目の id 集合。
      var expandedMemoIds = {};

      Promise.all([
        window.SpecWebClient.callApi('assets.list', { includeArchived: '0' }),
        window.SpecWebClient.callApi('whoami', {})
      ]).then(function (results) {
        var assetsRes = results[0], whoamiRes = results[1];
        if (!assetsRes.ok || !whoamiRes.ok || !whoamiRes.email) {
          statusLine.textContent = '取得に失敗しました（ログイン状態を確認してください）。';
          return;
        }
        statusLine.textContent = '';
        var today = todayString();
        var ordered = logic.myOrderedItems(assetsRes.items, whoamiRes.email, today);
        var contracted = logic.myContractedItems(assetsRes.items, whoamiRes.email, today);
        var canEdit = logic.roleAtLeast(whoamiRes.role, 'editor');

        function renderColumns() {
          columns.innerHTML = '';
          var itemState = {
            canEdit: canEdit,
            expandedMemoIds: expandedMemoIds,
            toggleMemo: function (id) {
              expandedMemoIds[id] = !expandedMemoIds[id];
              renderColumns();
            },
            // 緊急修正（2026-09-14 追補）: 削除（アーカイブ）成功後、この画面は reload() を
            // 持たない（初回取得のみ）ため、両方の派生配列からその場で取り除いて再描画する。
            onDeleted: function (id) {
              ordered = ordered.filter(function (i) { return i.id !== id; });
              contracted = contracted.filter(function (i) { return i.id !== id; });
              renderColumns();
            }
          };
          columns.appendChild(el('div', { class: 'my-orders-column' }, [
            el('h3', { text: '私が発注したもの' }),
            renderOrderedList(ordered, itemState)
          ]));
          columns.appendChild(el('div', { class: 'my-orders-column' }, [
            el('h3', { text: '私が受けたもの（期限順）' }),
            renderContractedList(contracted, itemState)
          ]));
        }
        renderColumns();
      });
    });
  })();
</script>
