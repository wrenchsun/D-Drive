<script>
  /**
   * SPA の枠（ルーター + 画面登録の拡張点 + サーバー呼び出しの小さなラッパー）。
   * docs/32_spec_web.md「登録式の拡張点」規約のクライアント側実装。
   *
   * 後続チケット（各画面 html）は、自分の画面を追加する html ファイルの中で
   * `registerScreen('assets', function (root) { ... })` のように呼ぶだけで、この App.html や
   * Index.html を編集せずに画面を追加できる。画面 html は Index.html から
   * `<?!= include('html/Assets'); ?>` のように、この App.html より後に include すること
   * （スクリプトはドキュメント順に実行されるため、registerScreen が先に定義済みである必要がある）。
   *
   * 2026-09-14 追補（実デプロイで判明した誤りの修正、docs/32_spec_web.md §2.4 訂正）:
   * ① 人向け SPA は HtmlService の IFRAME サンドボックス（*.googleusercontent.com）で動くため、
   * 以下の2点が当初の想定と異なっていた:
   *
   *   1. `fetch(window.location.href + '?api=1&...')` はサーバー（/exec）を呼べない
   *      （iframe 自身の URL はサンドボックス側であり、`/exec` とは別オリジンになる。
   *      `allow-same-origin` があっても「/exec への同一オリジン fetch」にはならない）。
   *      → GAS 公式の方法である `google.script.run`（サーバー関数 `specWebUiCall`、
   *      Code.js 参照）に置き換えた。呼び出し側（Assets.html・Tuning.html 等）の
   *      `SpecWebClient.callApi(name, params, options)` の形は変えていない
   *      （`options.method` は google.script.run では意味を持たないため無視するだけ）。
   *
   *   2. `location.hash` / `hashchange` によるルーティングは機能しない
   *      （`html/Index.html` の `<base target="_top">` により、`<a href="#/xxx">` の既定動作は
   *      iframe の外（script.google.com 側）の URL を変えるだけで、iframe 内の
   *      `hashchange` は発火しない）。
   *      → ナビゲーションは iframe 内で完結させる。各画面は `#app-nav`/`#app-root` に
   *      `<a href="#/xxx">` を作る際、クリックで `ev.preventDefault()` した上で
   *      `window.SpecWebNavigate('xxx')` を呼ぶ（既存の画面ファイルもこの形に合わせて修正した）。
   *      URL の状態保持・戻る/進むボタン対応には `google.script.history`
   *      （https://developers.google.com/apps-script/guides/html/reference/history）を使う。
   *      外部リンク（ガント・Markdown 内のリンク）は従来どおり `target="_top"` + `rel="noopener"`
   *      のまま（これらは iframe 内ルーティングの対象ではない）。
   *
   * ② D-Drive API（doGet/doPost + token）はこの変更の影響を受けない。
   */
  (function () {
    'use strict';

    var DEFAULT_SCREEN_ID = 'orders'; // 発注ツリー（O-2）。まだ無ければ 'assets'（一覧）。
    var screens = {};
    // 緊急修正（2026-09-14、O-15 追補）: 「発注ツリー/私の発注の『編集』を押しても一覧が
    // 表示されるだけで詳細が開かない」への対応。google.script.history.push()/replace() は
    // 環境によって setChangeHandler の登録済みハンドラを（自分自身の呼び出しに対しても）
    // 直後に呼び直すことがあり、その場合 navigateTo が { skipHistory: true } で同じ画面・
    // 同じ params にもう一度呼ばれて render() が丸ごと再実行される。これは「まさに今開けた
    // 詳細パネル（openId 付き遷移の結果）」を含む DOM を破棄して素の一覧を作り直す動きになり、
    // 症状として「一覧は出るが詳細が開かない」に一致する。同一画面・同一 params への
    // skipHistory な再遷移は無視して直前の描画を保持する（history.push 自体は一度しか呼ばない
    // ため、無視しても実害はない）。
    var currentRenderId_ = null;
    var currentRenderParamsJson_ = null;
    // 2026-09-15 二度目の修正（docs/32_spec_web.md 参照）: 上のガードだけでは実デプロイの
    // 症状が直らなかった。google.script.history.push/replace は iframe サンドボックスの
    // 境界を postMessage で越えるため、setChangeHandler が「自分自身の push」に対しても
    // 非同期に呼び直されることがあり、その際 URL に実際に載る hash（画面 id）だけしか
    // 復元できず、state.params のような入れ子オブジェクトが失われて渡ってくることがある
    // （id は一致するが params が空になる＝上のガードの paramsJson 一致条件に引っかからない）。
    // push/replace を呼んだ直後の一定時間内に「同じ画面 id・params 不一致」の skipHistory な
    // 再遷移が来た場合は、そのこだまである可能性が高いとみなし、再 render せず直前の描画を
    // 保持する（本物の戻る/進むボタン操作が push した直後の同じ画面にちょうど当たることは
    // 実運用上ほぼ無いため、この時間窓で誤って本物の戻る操作を無視するリスクは小さい）。
    var lastOwnHistoryWriteAt_ = null;
    var ECHO_GUARD_MS = 3000;
    // 画面を離れるときに後始末したい画面（document へのイベント登録等）向けに、
    // 現在の画面の render() が返した cleanup 関数を保持する（無ければ null）。
    var currentCleanup_ = null;

    /**
     * @param {function(root, params): (function()|void)} render 画面の描画関数。
     *   画面を離れる際に後始末（document のイベント登録解除等）が必要な場合は、
     *   その後始末を行う関数を返す（renderScreen が次の画面に切り替える直前に呼ぶ）。
     *   何も返さなければ後始末は無し（既存の画面はこの戻り値を無視するだけで動く）。
     */
    function registerScreen(id, render) {
      if (screens[id]) {
        console.warn('画面は既に登録されています: ' + id);
      }
      screens[id] = render;
    }

    /**
     * @param {string} id 画面 id
     * @param {Object} [params] 画面ごとの初期パラメータ（2026-09-14 追加。例: manual 画面の { p: 'Readme' }）。
     *   既存の画面（render(root) しか受け取らないもの）は第 2 引数を無視するだけで動く。
     */
    function renderScreen(id, params) {
      // 2026-09-15: 前の画面が document 等に張ったままのリスナーを、次の画面に切り替える前に
      // 必ず解除する（画面を離れても解除されない listener が、別の画面に切り替わった後の
      // クリックで誤発火する事故を防ぐ）。
      if (typeof currentCleanup_ === 'function') {
        try {
          currentCleanup_();
        } catch (e) {
          console.warn('前の画面の後始末（cleanup）で例外が発生しました', e);
        }
      }
      currentCleanup_ = null;

      var root = document.getElementById('app-root');
      var render = screens[id] || screens[DEFAULT_SCREEN_ID];
      var resolvedId = screens[id] ? id : DEFAULT_SCREEN_ID;
      console.info('[SpecWeb nav] renderScreen', { id: id, resolvedId: resolvedId, params: params });
      root.innerHTML = '';
      if (!render) {
        root.textContent = '画面が登録されていません: ' + id;
        return resolvedId;
      }
      var cleanup = render(root, params || {});
      if (typeof cleanup === 'function') currentCleanup_ = cleanup;
      return resolvedId;
    }

    /**
     * 画面を切り替える（iframe 内で完結。history.push 相当を google.script.history 経由で行う）。
     * 各画面のナビゲーションリンクはこれを呼ぶ（window.SpecWebNavigate として公開）。
     * @param {Object} [options.params] renderScreen に渡す初期パラメータ（2026-09-14 追加）。
     */
    function navigateTo(id, options) {
      options = options || {};
      var params = options.params || {};
      var paramsJson = JSON.stringify(params);
      console.info('[SpecWeb nav] navigateTo', { id: id, params: params, skipHistory: !!options.skipHistory });

      if (options.skipHistory && id === currentRenderId_) {
        // 上のコメント参照: skipHistory な再遷移が、直前と同じ画面・同じ params であれば
        // 何もしない（push/replace が引き起こす再帰的な setChangeHandler 呼び出しを無害化する）。
        if (paramsJson === currentRenderParamsJson_) {
          return currentRenderId_;
        }
        // 2026-09-15 二度目の修正: 「params が丸ごと消えている」場合に限り、直前に自分自身が
        // push/replace した直後（ECHO_GUARD_MS 以内）なら iframe 境界を越える往復で params が
        // 失われたこだまとみなして無視する（直前の描画を保持する）。params が単に「別の値」に
        // 変わっている場合（例: 同じ画面 id で別の manual ページへの本物の戻る/進む）は、
        // こだまではなく正当な履歴操作の可能性があるため、ここでは無視しない
        // （画面 id が同じだけで抑制すると、本物の戻る/進むが直後に来たときに効かなくなる）。
        var incomingIsEmpty = Object.keys(params).length === 0;
        var currentHadParams = currentRenderParamsJson_ && currentRenderParamsJson_ !== '{}';
        if (incomingIsEmpty && currentHadParams &&
          lastOwnHistoryWriteAt_ !== null && (Date.now() - lastOwnHistoryWriteAt_) < ECHO_GUARD_MS) {
          console.info('[SpecWeb nav] ignoring likely lossy history echo (same screen, params dropped)', {
            id: id, currentParamsJson: currentRenderParamsJson_
          });
          return currentRenderId_;
        }
      }

      // 2026-09-15 二度目の修正: どの経路であれ openId 付きで発注ツリー/私の発注から
      // 遷移する場合は、renderScreen の params だけに頼らず window.SpecWebPendingOpen にも
      // 同じ内容を控えておく（Assets.html の maybeOpenPending が params 経路が壊れていても
      // 拾えるようにする最後の保険。10 秒より古いものは無視・使ったら消す）。
      if (params && params.openId) {
        window.SpecWebPendingOpen = { id: params.openId, backTo: params.backTo || null, at: Date.now() };
      }

      var resolvedId = renderScreen(id, params);
      currentRenderId_ = resolvedId;
      currentRenderParamsJson_ = paramsJson;
      if (window.google && window.google.script && window.google.script.history && !options.skipHistory) {
        var method = options.replace ? 'replace' : 'push';
        lastOwnHistoryWriteAt_ = Date.now();
        window.google.script.history[method]({ screen: resolvedId, params: params }, {}, resolvedId);
      }
      return resolvedId;
    }

    if (window.google && window.google.script && window.google.script.history) {
      window.google.script.history.setChangeHandler(function (e) {
        var id = (e && e.state && e.state.screen) || DEFAULT_SCREEN_ID;
        var params = (e && e.state && e.state.params) || {};
        navigateTo(id, { skipHistory: true, params: params });
      });
    }

    window.addEventListener('DOMContentLoaded', function () {
      // 2026-09-14 追加: `?page=manual&p=...`（Unity の「マニュアル」ボタン等）で開かれた場合、
      // src/Code.js の resolveInitialScreen_ が設定した window.SpecWebInitialScreen/Params から
      // 初期画面を決める。無ければ既定画面（DEFAULT_SCREEN_ID）のまま（従来どおり）。
      var initialScreen = window.SpecWebInitialScreen || DEFAULT_SCREEN_ID;
      var initialParams = window.SpecWebInitialParams || {};
      navigateTo(initialScreen, { skipHistory: true, params: initialParams });
    });

    /**
     * サーバー API 呼び出しの小さなラッパー（後続チケットが使う拡張点）。
     * google.script.run.withSuccessHandler/withFailureHandler で
     * サーバー側の `specWebUiCall(name, params)`（Code.js）を呼ぶ。
     * options は互換性のためだけに残す（method 等は google.script.run では意味を持たない）。
     */
    window.SpecWebClient = {
      callApi: function (name, params) {
        params = params || {};
        return new Promise(function (resolve) {
          if (!(window.google && window.google.script && window.google.script.run)) {
            resolve({ ok: false, status: 500, error: 'google.script.run が利用できない環境です（Apps Script の外で開いていませんか？）' });
            return;
          }
          window.google.script.run
            .withSuccessHandler(function (result) {
              resolve(result);
            })
            .withFailureHandler(function (err) {
              resolve({ ok: false, status: 500, error: (err && err.message) || String(err) });
            })
            .specWebUiCall(name, params);
        });
      }
    };

    window.registerScreen = registerScreen;
    window.SpecWebNavigate = navigateTo;
  })();
</script>
