<style>
  /* Assets.html 専用の見た目（共通 Styles.html は編集していない）。 */
  .assets-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  .assets-toolbar input[type='text'],
  .assets-toolbar select {
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--sw-border);
    border-radius: 4px;
    font-size: 0.9rem;
  }
  .assets-toolbar button,
  .assets-detail button {
    padding: 0.35rem 0.8rem;
    border: 1px solid var(--sw-accent);
    background: var(--sw-accent);
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .assets-toolbar button.secondary,
  .assets-detail button.secondary {
    background: #fff;
    color: var(--sw-accent);
  }
  .assets-toolbar label {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    font-size: 0.85rem;
    color: var(--sw-muted);
  }
  table.assets-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  table.assets-table th,
  table.assets-table td {
    border-bottom: 1px solid var(--sw-border);
    padding: 0.4rem 0.5rem;
    text-align: left;
  }
  table.assets-table th {
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  table.assets-table th.sw-sort-active {
    color: var(--sw-accent);
  }
  table.assets-table tbody tr {
    cursor: pointer;
  }
  table.assets-table tbody tr:hover {
    background: #f6f8fa;
  }
  tr.assets-group-row td {
    background: #f6f8fa;
    font-weight: bold;
    color: var(--sw-muted);
    cursor: default;
  }
  .assets-detail-overlay {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: rgba(0, 0, 0, 0.25);
    display: flex;
    justify-content: flex-end;
  }
  .assets-detail {
    width: min(520px, 100%);
    background: var(--sw-bg);
    height: 100%;
    overflow-y: auto;
    padding: 1.25rem;
    box-sizing: border-box;
  }
  .assets-detail h2 {
    margin-top: 0;
    font-size: 1.1rem;
  }
  .assets-field {
    margin-bottom: 0.85rem;
  }
  .assets-field label {
    display: block;
    font-size: 0.8rem;
    color: var(--sw-muted);
    margin-bottom: 0.2rem;
  }
  .assets-field input,
  .assets-field select,
  .assets-field textarea {
    width: 100%;
    padding: 0.35rem 0.5rem;
    border: 1px solid var(--sw-border);
    border-radius: 4px;
    font-size: 0.9rem;
    box-sizing: border-box;
  }
  .assets-field.sw-field-error input,
  .assets-field.sw-field-error select,
  .assets-field.sw-field-error textarea {
    border-color: #cf222e;
  }
  .assets-field .sw-field-error-message {
    color: #cf222e;
    font-size: 0.78rem;
    margin-top: 0.2rem;
  }
  .assets-field .sw-field-warning-message {
    color: #9a6700;
    font-size: 0.78rem;
    margin-top: 0.2rem;
  }
  .assets-field .sw-field-hint {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--sw-muted);
    margin-top: 0.2rem;
  }
  .assets-field .sw-field-hint button {
    padding: 0.1rem 0.4rem;
    font-size: 0.75rem;
  }
  .sw-copylink {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
  }
  .sw-copylink button {
    padding: 0.2rem 0.5rem;
    font-size: 0.8rem;
  }
  .sw-copylink-menu {
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 5;
    background: var(--sw-bg);
    border: 1px solid var(--sw-border);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    padding: 0.2rem;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  }
  .sw-copylink-menu button {
    text-align: left;
    background: none;
    border: none;
    color: inherit;
  }
  .sw-copylink-status {
    font-size: 0.75rem;
    color: var(--sw-muted);
  }
  .sw-copylink-fallback {
    width: 100%;
    margin-top: 0.3rem;
    font-size: 0.75rem;
  }
  .assets-ddrive-state,
  .assets-params {
    border: 1px solid var(--sw-border);
    border-radius: 4px;
    padding: 0.6rem 0.75rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    background: #f6f8fa;
  }
  .assets-params table {
    width: 100%;
    font-size: 0.82rem;
    border-collapse: collapse;
  }
  .assets-params th,
  .assets-params td {
    text-align: left;
    padding: 0.15rem 0.3rem;
    border-bottom: 1px dashed var(--sw-border);
  }
  .assets-status-progress {
    display: flex;
    gap: 0.4rem;
    align-items: center;
    margin-bottom: 0.75rem;
    font-size: 0.9rem;
  }
  .assets-status-step {
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    background: #eaeef2;
  }
  .assets-status-step.sw-current {
    background: var(--sw-accent);
    color: #fff;
    font-weight: bold;
  }
  .assets-md-preview {
    border: 1px solid var(--sw-border);
    border-radius: 4px;
    padding: 0.5rem;
    font-size: 0.85rem;
    background: #fff;
    margin-top: 0.3rem;
  }
  .assets-md-preview img {
    max-width: 100%;
  }
  .assets-comment {
    border-top: 1px solid var(--sw-border);
    padding: 0.5rem 0;
    font-size: 0.85rem;
  }
  .assets-comment .sw-comment-meta {
    color: var(--sw-muted);
    font-size: 0.75rem;
  }
  .assets-detail-actions {
    display: flex;
    gap: 0.5rem;
    margin: 1rem 0;
    flex-wrap: wrap;
  }
  .sw-badge {
    display: inline-block;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    font-size: 0.8rem;
    background: #eaeef2;
  }
</style>

<script>
  /**
   * アセット発注 一覧・詳細画面（O-1〜O-3・O-5）。docs/32_spec_web.md §10.3.2（一覧）・
   * §10.3.4（詳細）を実装する。旧「アセット仕様」画面（W-4/W-5）をこのファイルの上で
   * 発注向けに作り直したもの（画面の骨格・DOM 組み立て方針は継承）。
   *
   * 注意: この画面が使う window.AssetsLogic は html/AssetsLogic.html が定義する。
   * include() は入れ子のスクリプトレットを評価しないため、Index.html から
   * App.html の後・Assets.html の前に直接 include する（既存の注意を継承）。
   *
   * DOM を組み立てる処理はここに書き、絞り込み・並べ替え・検証・Markdown 変換等の純粋関数は
   * AssetsLogic.html（window.AssetsLogic）に分けてある（そちらは Node でも単体テストできる）。
   */
  (function () {
    'use strict';

    var logic = window.AssetsLogic;

    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      attrs = attrs || {};
      Object.keys(attrs).forEach(function (key) {
        if (key === 'class') {
          node.className = attrs[key];
        } else if (key === 'text') {
          node.textContent = attrs[key];
        } else if (key === 'html') {
          node.innerHTML = attrs[key];
        } else if (key.indexOf('on') === 0 && typeof attrs[key] === 'function') {
          node.addEventListener(key.slice(2), attrs[key]);
        } else {
          node.setAttribute(key, attrs[key]);
        }
      });
      (children || []).forEach(function (child) {
        if (child) node.appendChild(child);
      });
      return node;
    }

    /**
     * O-13: 「リンクをコピー」ボタン + ▼ メニュー（URL のみ / 名前付き / Markdown）。
     * html/OrderTree.html にも同じ形の関数がある（el() 同様、画面ごとに小さく複製する既存方針）。
     * @param {function():string} getUrl 呼び出し時点の URL を返す（execUrl が未取得なら空文字を返してよい）
     * @param {function():string} [getLabel] 「名前付き」「Markdown」で使う表示名
     */
    function buildCopyLinkControl(getUrl, getLabel) {
      var wrap = el('span', { class: 'sw-copylink' });
      var status = el('span', { class: 'sw-copylink-status' });
      var menu = el('div', { class: 'sw-copylink-menu' });
      menu.hidden = true;
      var fallback = null;

      function clearFallback() {
        if (fallback) {
          wrap.removeChild(fallback);
          fallback = null;
        }
      }

      function doCopy(mode) {
        menu.hidden = true;
        var url = getUrl();
        if (!url) {
          status.textContent = 'URL を取得できませんでした（execUrl 未取得）';
          return;
        }
        var text = window.OrderLinkLogic.formatLinkText(mode, getLabel ? getLabel() : '', url);
        window.SpecWebClipboard.copyText(text).then(function (ok) {
          clearFallback();
          if (ok) {
            status.textContent = 'コピーしました';
            return;
          }
          status.textContent = 'Ctrl+C でコピーしてください';
          fallback = el('input', { type: 'text', readonly: 'readonly', class: 'sw-copylink-fallback' });
          fallback.value = text;
          wrap.appendChild(fallback);
          if (fallback.select) fallback.select();
        });
      }

      var mainButton = el('button', {
        class: 'secondary',
        text: 'リンクをコピー',
        onclick: function (ev) {
          if (ev && ev.stopPropagation) ev.stopPropagation();
          doCopy('url');
        }
      });
      var menuButton = el('button', {
        class: 'secondary',
        text: '▼',
        onclick: function (ev) {
          if (ev && ev.stopPropagation) ev.stopPropagation();
          menu.hidden = !menu.hidden;
        }
      });
      [['url', 'URL のみ'], ['named', '名前付き（表示名 - URL）'], ['markdown', 'Markdown']].forEach(function (pair) {
        menu.appendChild(el('button', {
          text: pair[1],
          onclick: function (ev) {
            if (ev && ev.stopPropagation) ev.stopPropagation();
            doCopy(pair[0]);
          }
        }));
      });

      wrap.appendChild(mainButton);
      wrap.appendChild(menuButton);
      wrap.appendChild(menu);
      wrap.appendChild(status);
      return wrap;
    }

    // ナビゲーションに自分でリンクを追加する（html/Index.html の #app-nav は空のままにし、
    // 画面ごとに自分でリンクを足す設計にすることで、共通ファイルを編集せずに増やせるようにする）。
    var navHost = document.getElementById('app-nav');
    if (navHost && !navHost.querySelector('a[href="#/assets"]')) {
      // 2026-09-14 追補: iframe サンドボックス内では既定のハッシュ遷移が効かないため、
      // クリックを preventDefault して window.SpecWebNavigate で画面内遷移する
      // （App.html 冒頭のコメント・docs/32 §2.4 訂正参照）。
      navHost.appendChild(el('a', {
        href: '#/assets',
        text: '一覧',
        onclick: function (ev) {
          if (ev && ev.preventDefault) ev.preventDefault();
          window.SpecWebNavigate('assets');
        }
      }));
    }

    registerScreen('assets', function (root, initialParams) {
      var state = {
        items: [],
        orderGroups: [],
        members: [],
        currentUser: { role: null },
        filters: { query: '', assetType: '', status: '', orderer: '', contractor: '', fileFormat: '', parentId: '' },
        sort: { key: 'identifier', direction: 'asc' },
        grouped: false,
        // O-13: `?page=order&id=...` で開かれた場合に一度だけ自動で開く対象の id
        // （src/Code.js の resolveInitialScreen_ → App.html の render(root, params) 経由）。
        pendingOpenId: (initialParams && initialParams.openId) || null,
        detail: null // { mode: 'create'|'edit', item, fields, errors, paramSchemas, showMdPreview }
      };

      var toolbar = el('div', { class: 'assets-toolbar' });
      var table = el('table', { class: 'assets-table' });
      var statusLine = el('p', { class: 'sw-muted' });
      var overlayHost = el('div');

      root.appendChild(statusLine);
      root.appendChild(toolbar);
      root.appendChild(table);
      root.appendChild(overlayHost);

      function canEdit() {
        return logic.roleAtLeast(state.currentUser.role, 'editor');
      }

      function groupLabelFor(parentId) {
        if (!parentId) return '単体';
        var group = state.orderGroups.filter(function (g) { return g.id === parentId; })[0];
        return group ? group.name : parentId;
      }

      function visibleItems() {
        var filtered = logic.filterAssets(state.items, state.filters);
        return logic.sortAssets(filtered, state.sort.key, state.sort.direction);
      }

      function optionValuesFrom(key) {
        var set = {};
        state.items.forEach(function (item) {
          if (item[key]) set[item[key]] = true;
        });
        return Object.keys(set).sort();
      }

      function buildSelect(options, current, includeAllLabel) {
        var select = el('select');
        if (includeAllLabel) {
          select.appendChild(el('option', { value: '', text: includeAllLabel }));
        }
        options.forEach(function (opt) {
          var value = typeof opt === 'object' ? opt.value : opt;
          var label = typeof opt === 'object' ? opt.label : opt;
          var optionEl = el('option', { value: value, text: label });
          if (value === current) optionEl.selected = true;
          select.appendChild(optionEl);
        });
        return select;
      }

      function renderToolbar() {
        toolbar.innerHTML = '';

        var search = el('input', { type: 'text', placeholder: '検索（識別子・表示名・リファレンス）' });
        search.value = state.filters.query;
        search.addEventListener('input', function () {
          state.filters.query = search.value;
          renderTable();
        });
        toolbar.appendChild(search);

        var typeSelect = buildSelect(logic.ASSET_TYPES, state.filters.assetType, '種類: 全て');
        typeSelect.addEventListener('change', function () {
          state.filters.assetType = typeSelect.value;
          renderTable();
        });
        toolbar.appendChild(typeSelect);

        var statusSelect = buildSelect(logic.ASSET_STATUSES, state.filters.status, '状態: 全て');
        statusSelect.addEventListener('change', function () {
          state.filters.status = statusSelect.value;
          renderTable();
        });
        toolbar.appendChild(statusSelect);

        var ordererSelect = buildSelect(optionValuesFrom('orderer'), state.filters.orderer, '発注者: 全て');
        ordererSelect.addEventListener('change', function () {
          state.filters.orderer = ordererSelect.value;
          renderTable();
        });
        toolbar.appendChild(ordererSelect);

        var contractorSelect = buildSelect(optionValuesFrom('contractor'), state.filters.contractor, '受注者: 全て');
        contractorSelect.addEventListener('change', function () {
          state.filters.contractor = contractorSelect.value;
          renderTable();
        });
        toolbar.appendChild(contractorSelect);

        // O-12: 並べ替え/絞り込みの追加対象はファイル形式のみ（fileName は対象外、§10.2.1 追補）。
        var fileFormatSelect = buildSelect(optionValuesFrom('fileFormat'), state.filters.fileFormat, 'ファイル形式: 全て');
        fileFormatSelect.addEventListener('change', function () {
          state.filters.fileFormat = fileFormatSelect.value;
          renderTable();
        });
        toolbar.appendChild(fileFormatSelect);

        var groupOptions = [{ value: '__none__', label: '単体' }].concat(
          state.orderGroups.map(function (g) { return { value: g.id, label: g.name }; })
        );
        var presentationSelect = buildSelect(groupOptions, state.filters.parentId, 'Presentation: 全て');
        presentationSelect.addEventListener('change', function () {
          state.filters.parentId = presentationSelect.value;
          renderTable();
        });
        toolbar.appendChild(presentationSelect);

        var groupLabel = el('label');
        var groupCheckbox = el('input', { type: 'checkbox' });
        groupCheckbox.checked = state.grouped;
        groupCheckbox.addEventListener('change', function () {
          state.grouped = groupCheckbox.checked;
          renderTable();
        });
        groupLabel.appendChild(groupCheckbox);
        groupLabel.appendChild(document.createTextNode('種類でグループ化'));
        toolbar.appendChild(groupLabel);

        if (canEdit()) {
          var newButton = el('button', {
            text: '+ 新規発注',
            onclick: function () {
              openDetail({ mode: 'create' });
            }
          });
          toolbar.appendChild(newButton);
        }
      }

      function sortIndicator(key) {
        if (state.sort.key !== key) return '';
        return state.sort.direction === 'asc' ? ' ▲' : ' ▼';
      }

      function renderHeader() {
        var thead = el('thead');
        var headerRow = el('tr');
        var columns = [
          { key: 'assetType', label: '種類' },
          { key: 'identifier', label: 'インポート名' },
          { key: 'orderer', label: '発注者' },
          { key: 'contractor', label: '受注者' },
          { key: 'orderDate', label: '発注日' },
          { key: 'dueDate', label: '納品期限' },
          { key: 'status', label: '状態' },
          { key: 'fileFormat', label: 'ファイル形式' } // O-12（狭い画面では CSS 側で省略してよい）
        ];
        columns.forEach(function (col) {
          var th = el('th', { text: col.label + sortIndicator(col.key) });
          if (state.sort.key === col.key) th.className = 'sw-sort-active';
          th.addEventListener('click', function () {
            if (state.sort.key === col.key) {
              state.sort.direction = state.sort.direction === 'asc' ? 'desc' : 'asc';
            } else {
              state.sort.key = col.key;
              state.sort.direction = 'asc';
            }
            renderTable();
          });
          headerRow.appendChild(th);
        });
        headerRow.appendChild(el('th', { text: 'D-Drive状態' }));
        headerRow.appendChild(el('th', { text: '' })); // O-13: リンクをコピー列（見出しなし）
        thead.appendChild(headerRow);
        return thead;
      }

      function buildRow(item) {
        var badge = logic.formatDdriveStateBadge(item.ddriveState);
        var copyCell = el('td');
        copyCell.appendChild(buildCopyLinkControl(
          function () { return window.OrderLinkLogic.buildOrderUrl(window.SpecWebExecUrl, item.id); },
          function () { return item.displayName || item.identifier; }
        ));
        var row = el('tr', {
          onclick: function () {
            openDetail({ mode: 'edit', item: item });
          }
        }, [
          el('td', { text: item.assetType }),
          el('td', { text: item.identifier }),
          el('td', { text: item.orderer || '—' }),
          el('td', { text: item.contractor || '—' }),
          el('td', { text: item.orderDate || '—' }),
          el('td', { text: item.dueDate || '—' }),
          el('td', { text: item.status }),
          el('td', { text: item.fileFormat || '—' }),
          el('td', { text: badge.icon + ' ' + badge.label }),
          copyCell
        ]);
        return row;
      }

      function renderTable() {
        table.innerHTML = '';
        table.appendChild(renderHeader());
        var newTbody = el('tbody');
        var items = visibleItems();

        if (items.length === 0) {
          newTbody.appendChild(el('tr', {}, [el('td', { text: '該当する発注がありません', colspan: '10' })]));
        } else if (state.grouped) {
          logic.groupAssetsByType(items).forEach(function (group) {
            newTbody.appendChild(
              el('tr', { class: 'assets-group-row' }, [
                el('td', { text: group.assetType + '（' + group.items.length + '件）', colspan: '10' })
              ])
            );
            group.items.forEach(function (item) {
              newTbody.appendChild(buildRow(item));
            });
          });
        } else {
          items.forEach(function (item) {
            newTbody.appendChild(buildRow(item));
          });
        }
        table.appendChild(newTbody);
        statusLine.textContent = '全 ' + state.items.length + ' 件中 ' + items.length + ' 件を表示';
      }

      function renderAll() {
        renderToolbar();
        renderTable();
      }

      function reload() {
        statusLine.textContent = '読み込み中...';
        return Promise.all([
          window.SpecWebClient.callApi('assets.list', { includeArchived: '0' }),
          window.SpecWebClient.callApi('orderGroups.list', {}),
          window.SpecWebClient.callApi('members.list', {})
        ]).then(function (results) {
          var assetsRes = results[0], groupsRes = results[1], membersRes = results[2];
          if (!assetsRes.ok) {
            statusLine.textContent = '一覧の取得に失敗しました: ' + (assetsRes.error || '');
            return;
          }
          state.items = assetsRes.items || [];
          state.orderGroups = groupsRes.ok ? groupsRes.items || [] : [];
          state.members = membersRes.ok ? membersRes.items || [] : [];
          renderAll();
          maybeOpenPending();
        });
      }

      /**
       * O-13: `?page=order&id=...` で開かれた場合、一覧の読み込み後に一度だけ対象の詳細を開く。
       * 見つからなければ例外にせず一覧の上に案内を出すだけにする（トップ表示は既に renderAll 済み）。
       */
      function maybeOpenPending() {
        if (!state.pendingOpenId) return;
        var pendingId = state.pendingOpenId;
        state.pendingOpenId = null;
        var found = state.items.filter(function (i) { return i.id === pendingId; })[0];
        if (found) {
          openDetail({ mode: 'edit', item: found });
        } else {
          statusLine.textContent = '指定された発注が見つかりません（' + pendingId + '）。一覧を表示しています。';
        }
      }

      // ---- 詳細パネル（§10.3.4） ----

      function emptyFields() {
        return {
          assetType: '', category: '', identifier: '', displayName: '', status: '発注済',
          orderer: '', contractor: '', orderDate: '', dueDate: '', deliveredDate: '',
          priority: '', referenceMd: '', parentId: '', fileFormat: '', fileName: ''
        };
      }

      function fieldsFromItem(item) {
        return {
          assetType: item.assetType || '',
          category: item.category || '',
          identifier: item.identifier || '',
          displayName: item.displayName || '',
          status: item.status || '',
          orderer: item.orderer || '',
          contractor: item.contractor || '',
          orderDate: item.orderDate || '',
          dueDate: item.dueDate || '',
          deliveredDate: item.deliveredDate || '',
          priority: item.priority || '',
          referenceMd: item.referenceMd || '',
          parentId: item.parentId || '',
          fileFormat: item.fileFormat || '',
          fileName: item.fileName || ''
        };
      }

      function closeDetail() {
        overlayHost.innerHTML = '';
        state.detail = null;
      }

      function openDetail(detail) {
        state.detail = detail;
        detail.fields = detail.mode === 'create' ? emptyFields() : fieldsFromItem(detail.item);
        detail.errors = {};
        detail.showMdPreview = false;
        detail.paramSchemas = [];

        if (detail.mode === 'edit') {
          // 一覧のキャッシュではなく、コメント・最新 revision・params を含む全項目を取得し直す（§10.3.4）。
          Promise.all([
            window.SpecWebClient.callApi('assets.get', { id: detail.item.id }),
            window.SpecWebClient.callApi('paramSchemas.list', { assetType: detail.item.assetType })
          ]).then(function (results) {
            var itemRes = results[0], schemaRes = results[1];
            if (itemRes.ok) {
              detail.item = itemRes.item;
              detail.fields = fieldsFromItem(itemRes.item);
            }
            if (schemaRes.ok) detail.paramSchemas = schemaRes.items || [];
            renderDetail();
          });
        }
        renderDetail();
      }

      function fieldRow(key, label, inputEl) {
        var wrap = el('div', { class: 'assets-field' });
        wrap.appendChild(el('label', { text: label }));
        wrap.appendChild(inputEl);
        if (state.detail.errors[key]) {
          wrap.className += ' sw-field-error';
          wrap.appendChild(el('div', { class: 'sw-field-error-message', text: state.detail.errors[key] }));
        }
        return wrap;
      }

      function runValidation() {
        var detail = state.detail;
        var result = logic.validateAssetFields(detail.fields, {
          existingItems: state.items,
          excludeId: detail.mode === 'edit' ? detail.item.id : null
        });
        detail.errors = result.errors;
        return result.valid;
      }

      function textField(key, label, type) {
        var input = el('input', { type: type || 'text' });
        input.value = state.detail.fields[key];
        var readOnly = !canEdit();
        input.disabled = readOnly || (key === 'identifier' || key === 'assetType') && state.detail.mode === 'edit';
        input.addEventListener('input', function () {
          state.detail.fields[key] = input.value;
          runValidation();
          renderDetail();
        });
        return fieldRow(key, label, input);
      }

      /** 発注者/受注者はメンバー一覧を datalist で候補表示しつつ自由入力も許可する（O-9）。 */
      function memberField(key, label) {
        var listId = 'assets-members-' + key;
        var input = el('input', { type: 'text', list: listId });
        input.value = state.detail.fields[key];
        input.disabled = !canEdit();
        input.addEventListener('input', function () {
          state.detail.fields[key] = input.value;
          renderDetail();
        });
        var datalist = el('datalist', { id: listId });
        state.members.forEach(function (m) {
          datalist.appendChild(el('option', { value: m.label }));
        });
        var wrap = fieldRow(key, label, input);
        wrap.appendChild(datalist);
        return wrap;
      }

      function selectField(key, label, options) {
        var select = buildSelect(options, state.detail.fields[key], key === 'status' ? null : '（未設定）');
        select.disabled = !canEdit() || (key === 'assetType' && state.detail.mode === 'edit');
        select.addEventListener('change', function () {
          state.detail.fields[key] = select.value;
          runValidation();
          renderDetail();
        });
        return fieldRow(key, label, select);
      }

      /** O-12: ファイル形式（種別ごとの候補を datalist で提示、候補外の自由入力も可）。 */
      function fileFormatField() {
        var listId = 'assets-fileformat-choices';
        var input = el('input', { type: 'text', list: listId, placeholder: '例: .wav' });
        input.value = state.detail.fields.fileFormat;
        input.disabled = !canEdit();
        input.addEventListener('input', function () {
          state.detail.fields.fileFormat = input.value;
          runValidation();
          renderDetail();
        });
        input.addEventListener('blur', function () {
          var normalized = logic.normalizeFileFormat(state.detail.fields.fileFormat);
          if (normalized !== state.detail.fields.fileFormat) {
            state.detail.fields.fileFormat = normalized;
            renderDetail();
          }
        });
        var datalist = el('datalist', { id: listId });
        logic.fileFormatChoicesFor(state.detail.fields.assetType).forEach(function (choice) {
          datalist.appendChild(el('option', { value: choice }));
        });
        var wrap = fieldRow('fileFormat', 'ファイル形式', input);
        wrap.appendChild(datalist);
        return wrap;
      }

      /**
       * O-12: 納品ファイル名。空欄時のプレースホルダーとして、種別・カテゴリ・識別子・ファイル形式
       * から D-Drive の命名規約に沿った推奨名を表示し、ボタンで入力欄へコピーできる（§10.2.1 追補）。
       * 不正文字・拡張子の食い違いはブロックしない警告として表示するだけ（例外で止めない）。
       */
      function fileNameField() {
        var input = el('input', { type: 'text', placeholder: '例: SE_Slash.wav' });
        input.value = state.detail.fields.fileName;
        input.disabled = !canEdit();
        input.addEventListener('input', function () {
          state.detail.fields.fileName = input.value;
          runValidation();
          renderDetail();
        });
        var wrap = fieldRow('fileName', '納品ファイル名', input);

        var suggested = logic.suggestFileName(
          state.detail.fields.assetType,
          state.detail.fields.category,
          state.detail.fields.identifier,
          state.detail.fields.fileFormat
        );
        if (suggested) {
          var hint = el('div', { class: 'sw-field-hint' }, [el('span', { text: '推奨: ' + suggested })]);
          if (canEdit()) {
            hint.appendChild(el('button', {
              class: 'secondary',
              text: '推奨名を使う',
              onclick: function () {
                state.detail.fields.fileName = suggested;
                runValidation();
                renderDetail();
              }
            }));
          }
          wrap.appendChild(hint);
        }

        logic.fileNameWarnings(state.detail.fields).forEach(function (message) {
          wrap.appendChild(el('div', { class: 'sw-field-warning-message', text: message }));
        });

        return wrap;
      }

      function parentIdField() {
        var options = [{ value: '', label: '単体' }].concat(
          state.orderGroups.map(function (g) { return { value: g.id, label: g.name }; })
        );
        var select = buildSelect(options, state.detail.fields.parentId, null);
        select.disabled = !canEdit();
        select.addEventListener('change', function () {
          state.detail.fields.parentId = select.value;
          renderDetail();
        });
        return fieldRow('parentId', 'Presentation（発注グループ）', select);
      }

      /** §10.3.4「状態: ● 発注済 ─ 納品済 ─ インポート済」の進行表示 + 手動ボタン（発注済⇄納品済のみ）。 */
      function renderStatusProgress(item) {
        var wrap = el('div');
        var steps = el('div', { class: 'assets-status-progress' });
        logic.ASSET_STATUSES.forEach(function (s, i) {
          if (i > 0) steps.appendChild(el('span', { text: '─' }));
          steps.appendChild(el('span', {
            class: 'assets-status-step' + (item.status === s ? ' sw-current' : ''),
            text: s
          }));
        });
        wrap.appendChild(steps);

        if (canEdit() && item.status !== logic.ASSET_STATUS_IMPORTED) {
          var actions = el('div', { class: 'assets-detail-actions' });
          if (item.status === '発注済') {
            actions.appendChild(el('button', {
              text: '納品済にする',
              onclick: function () { advanceStatus(item, '納品済'); }
            }));
          } else if (item.status === '納品済') {
            actions.appendChild(el('button', {
              class: 'secondary',
              text: '発注済に戻す',
              onclick: function () { advanceStatus(item, '発注済'); }
            }));
          }
          wrap.appendChild(actions);
        } else if (item.status === logic.ASSET_STATUS_IMPORTED) {
          wrap.appendChild(el('p', { class: 'sw-muted', text: '「インポート済」は D-Drive の同期でのみ切り替わります（手動では戻せません）。' }));
        }
        return wrap;
      }

      function advanceStatus(item, nextStatus) {
        window.SpecWebClient
          .callApi('assets.update', { id: item.id, expectedRevision: item.revision, patch: JSON.stringify({ status: nextStatus }) }, { method: 'POST' })
          .then(function (res) {
            if (!res.ok) {
              window.alert('状態の変更に失敗しました: ' + (res.error || ''));
              return;
            }
            state.detail.item = res.item;
            state.detail.fields = fieldsFromItem(res.item);
            renderDetail();
            reload();
          });
      }

      function renderReferenceMd() {
        var detail = state.detail;
        var wrap = el('div', { class: 'assets-field' });
        wrap.appendChild(el('label', { text: 'リファレンス（Markdown）' }));
        var textarea = el('textarea', { rows: '5' });
        textarea.value = detail.fields.referenceMd;
        textarea.disabled = !canEdit();
        textarea.addEventListener('input', function () {
          detail.fields.referenceMd = textarea.value;
        });
        wrap.appendChild(textarea);

        var toggle = el('button', {
          class: 'secondary',
          text: detail.showMdPreview ? 'プレビューを隠す' : 'プレビュー',
          onclick: function () {
            detail.showMdPreview = !detail.showMdPreview;
            renderDetail();
          }
        });
        wrap.appendChild(toggle);

        if (detail.showMdPreview) {
          var preview = el('div', { class: 'assets-md-preview' });
          preview.innerHTML = logic.renderMarkdownSafe(detail.fields.referenceMd);
          wrap.appendChild(preview);
        }
        return wrap;
      }

      /** §10.3.4「パラメータ一覧（読み取り専用、SeData）」。O-6 の受け皿（AssetParams.js）が送るスキーマ・現在値を表示する。 */
      function renderParams(item, paramSchemas) {
        if (!paramSchemas || paramSchemas.length === 0) return null;
        var box = el('div', { class: 'assets-params' });
        box.appendChild(el('div', { text: 'パラメータ一覧（読み取り専用）' }));
        var currentValues = item.params && item.params.currentValues ? item.params.currentValues : null;
        paramSchemas.forEach(function (schema) {
          var table = el('table');
          var thead = el('tr', {}, [
            el('th', { text: schema.concreteType }),
            el('th', { text: '型' }),
            el('th', { text: '説明' }),
            el('th', { text: '現在値' })
          ]);
          table.appendChild(el('thead', {}, [thead]));
          var tbody = el('tbody');
          (schema.fields || []).forEach(function (f) {
            tbody.appendChild(el('tr', {}, [
              el('td', { text: f.name }),
              el('td', { text: f.type }),
              el('td', { text: f.tooltip || '' }),
              el('td', { text: currentValues && currentValues[f.name] !== undefined ? String(currentValues[f.name]) : '（インポート済のみ）' })
            ]));
          });
          table.appendChild(tbody);
          box.appendChild(table);
        });
        return box;
      }

      function renderDdriveState(item) {
        var ddriveState = item && item.ddriveState;
        var badge = logic.formatDdriveStateBadge(ddriveState);
        var box = el('div', { class: 'assets-ddrive-state' });
        box.appendChild(el('div', {}, [el('span', { class: 'sw-badge', text: badge.icon + ' ' + badge.label })]));
        if (ddriveState) {
          box.appendChild(el('div', { text: '使用箇所数: ' + (ddriveState.usageCount || 0) }));
          box.appendChild(el('div', { text: '最終同期: ' + (ddriveState.lastSyncedAt || '未同期') }));
          box.appendChild(el('div', { text: logic.formatDdriveIconLabel(ddriveState) }));
        }
        box.appendChild(el('div', { class: 'sw-muted', text: '（D-Drive からの同期専用。この画面からは編集できません）' }));
        return box;
      }

      function renderComments(item) {
        var wrap = el('div');
        wrap.appendChild(el('h3', { text: 'コメント' }));
        var comments = logic.sortCommentsNewestFirst((item && item.comments) || []);
        if (comments.length === 0) {
          wrap.appendChild(el('p', { class: 'sw-muted', text: 'コメントはまだありません' }));
        }
        comments.forEach(function (comment) {
          wrap.appendChild(
            el('div', { class: 'assets-comment' }, [
              el('div', { text: comment.body }),
              el('div', { class: 'sw-comment-meta', text: comment.author + ' ・ ' + comment.createdAt })
            ])
          );
        });

        if (canEdit()) {
          var textarea = el('textarea', { rows: '2', placeholder: 'コメントを入力...' });
          var postButton = el('button', {
            class: 'secondary',
            text: 'コメントを投稿',
            onclick: function () {
              var body = textarea.value.trim();
              if (!body) return;
              window.SpecWebClient.callApi('assets.comments.add', { id: item.id, body: body }, { method: 'POST' }).then(function (res) {
                if (!res.ok) {
                  window.alert('コメントの投稿に失敗しました: ' + (res.error || ''));
                  return;
                }
                state.detail.item = res.item;
                renderDetail();
              });
            }
          });
          wrap.appendChild(textarea);
          wrap.appendChild(postButton);
        }
        return wrap;
      }

      function submitDetail() {
        var detail = state.detail;
        if (!runValidation()) {
          renderDetail();
          return;
        }
        var patch = Object.assign({}, detail.fields);

        if (detail.mode === 'create') {
          window.SpecWebClient.callApi('assets.create', { patch: JSON.stringify(patch) }, { method: 'POST' }).then(function (res) {
            if (!res.ok) {
              window.alert('作成に失敗しました: ' + (res.error || ''));
              return;
            }
            closeDetail();
            reload();
          });
        } else {
          // 種別・識別子はサーバー側でも更新できないため送らない（誤ってロックされたフィールドを
          // 送っても現在値と同じなら弾かれないが、意図を明確にするため除外する）。
          delete patch.assetType;
          delete patch.identifier;
          window.SpecWebClient
            .callApi(
              'assets.update',
              { id: detail.item.id, expectedRevision: detail.item.revision, patch: JSON.stringify(patch) },
              { method: 'POST' }
            )
            .then(function (res) {
              if (!res.ok) {
                if (res.status === 409) {
                  window.alert('他の人が先に更新しました。最新の内容を再読込します。');
                  openDetail({ mode: 'edit', item: detail.item });
                  reload();
                  return;
                }
                window.alert('更新に失敗しました: ' + (res.error || ''));
                return;
              }
              closeDetail();
              reload();
            });
        }
      }

      function deleteDetail() {
        var detail = state.detail;
        if (!window.confirm('この発注をアーカイブ（論理削除）します。よろしいですか？')) return;
        window.SpecWebClient
          .callApi('assets.delete', { id: detail.item.id, expectedRevision: detail.item.revision }, { method: 'POST' })
          .then(function (res) {
            if (!res.ok) {
              window.alert('削除に失敗しました: ' + (res.error || ''));
              return;
            }
            closeDetail();
            reload();
          });
      }

      function renderDetail() {
        overlayHost.innerHTML = '';
        var detail = state.detail;
        if (!detail) return;

        var panel = el('div', { class: 'assets-detail' });
        panel.appendChild(el('h2', { text: detail.mode === 'create' ? '新規発注' : (detail.item.assetType + ' :: ' + detail.item.identifier) }));

        if (detail.mode === 'edit') {
          // O-13: 発注リンクのコピー（このアプリの外＝人が読む仕様書に貼り付ける用）。
          panel.appendChild(buildCopyLinkControl(
            function () { return window.OrderLinkLogic.buildOrderUrl(window.SpecWebExecUrl, detail.item.id); },
            function () { return detail.item.displayName || detail.item.identifier; }
          ));
          panel.appendChild(renderStatusProgress(detail.item));
        }
        if (!canEdit()) {
          panel.appendChild(el('p', { class: 'sw-muted', text: '閲覧のみ（viewer ロールのため編集できません）' }));
        }

        panel.appendChild(selectField('assetType', '種類', logic.ASSET_TYPES));
        panel.appendChild(textField('identifier', 'インポート名: 識別子（PascalCase）'));
        panel.appendChild(textField('displayName', '表示名'));
        panel.appendChild(textField('category', 'カテゴリ'));
        panel.appendChild(parentIdField());
        panel.appendChild(memberField('orderer', '発注者'));
        panel.appendChild(memberField('contractor', '受注者'));
        panel.appendChild(textField('orderDate', '発注日', 'date'));
        panel.appendChild(textField('dueDate', '納品期限', 'date'));
        panel.appendChild(textField('deliveredDate', '納品日', 'date'));
        panel.appendChild(selectField('priority', '優先度', logic.ASSET_PRIORITIES));
        panel.appendChild(fileFormatField());
        panel.appendChild(fileNameField());
        panel.appendChild(renderReferenceMd());

        if (canEdit()) {
          var actions = el('div', { class: 'assets-detail-actions' });
          actions.appendChild(el('button', { text: '保存', onclick: submitDetail }));
          if (detail.mode === 'edit') {
            actions.appendChild(el('button', { class: 'secondary', text: '削除（アーカイブ）', onclick: deleteDetail }));
          }
          actions.appendChild(el('button', { class: 'secondary', text: '閉じる', onclick: closeDetail }));
          panel.appendChild(actions);
        } else {
          panel.appendChild(el('div', { class: 'assets-detail-actions' }, [
            el('button', { class: 'secondary', text: '閉じる', onclick: closeDetail })
          ]));
        }

        if (detail.mode === 'edit') {
          panel.appendChild(renderParams(detail.item, detail.paramSchemas));
          panel.appendChild(renderDdriveState(detail.item));
          panel.appendChild(renderComments(detail.item));
        }

        var overlay = el('div', {
          class: 'assets-detail-overlay',
          onclick: function (ev) {
            if (ev.target === overlay) closeDetail();
          }
        }, [panel]);
        overlayHost.appendChild(overlay);
      }

      window.SpecWebClient.callApi('whoami', {}).then(function (res) {
        if (res.ok) state.currentUser = res;
        renderAll();
      });
      reload();
    });
  })();
</script>
